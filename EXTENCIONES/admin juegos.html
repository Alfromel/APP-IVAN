<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Admin | Panel Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; }
  body { display: flex; align-items: stretch; justify-content: stretch; }
  .app { width: 100vw; height: 100vh; display: flex; overflow: hidden; background: #000000; }

  /* SIDEBAR */
  .sidebar { width: 260px; background: #080808; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s ease; overflow: hidden; }
  .sidebar.collapsed { width: 72px; }
  .sidebar-brand { padding: 20px 22px; display: flex; align-items: center; gap: 12px; color: #f0f0f5; font-weight: 700; font-size: 17px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-brand i { color: #f97316; font-size: 26px; min-width: 28px; text-align: center; }
  .sidebar-brand span.accent { color: #f97316; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; overflow-y: auto; overflow-x: hidden; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; color: #9a9ab0; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; background: transparent; text-align: left; width: 100%; white-space: nowrap; overflow: hidden; }
  .nav-item i { font-size: 17px; min-width: 22px; text-align: center; color: #6a6a85; }
  .nav-item:hover { background: #181818; color: #d0d0e0; }
  .nav-item.active { background: #202020; color: #fff; }
  .nav-item.active i { color: #f97316; }
  .sidebar.collapsed .nav-item span, .sidebar.collapsed .sidebar-brand span { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
  .sidebar-footer { padding: 16px 18px; border-top: 1px solid #242424; display: flex; align-items: center; gap: 12px; color: #6a6a85; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-footer .avatar { width: 34px; height: 34px; border-radius: 50%; background: #333333; display: flex; align-items: center; justify-content: center; color: #f97316; font-weight: 700; flex-shrink: 0; }
  .sidebar.collapsed .sidebar-footer span { display: none; }
  .sidebar.collapsed .sidebar-footer { justify-content: center; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000000; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #080808; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .toggle-btn { background: transparent; border: none; color: #8a8aa0; font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .toggle-btn:hover { background: #181818; color: #fff; }
  .topbar h1 { color: #e8e8f0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .topbar h1 i { color: #f97316; font-size: 20px; }
  .topbar-right .badge { background: #181818; color: #8a8aa0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }

  /* TOOLBAR */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-header h2 { color: #f0f0f5; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .page-header h2 i { color: #f97316; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { background: #181818; border: none; color: #d0d0e0; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: #2a2a2a; color: #fff; }
  .btn-primary { background: #f97316; color: #000000; }
  .btn-primary:hover { background: #ea580c; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: #c2410c; color: #000000; }
  .btn-danger:hover { background: #9a3412; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: #101010; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
  .stat-card .label { color: #8a8aa0; font-size: 12px; font-weight: 500; text-transform: uppercase; }
  .stat-card .value { color: #fff; font-size: 28px; font-weight: 700; }
  .stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
  .stat-card .icon-wrap i { font-size: 22px; opacity: 0.7; }

  /* TABLE */
  .table-wrap { background: #101010; border-radius: 14px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 700px; }
  th { text-align: left; padding: 13px 18px; color: #8a8aa0; font-weight: 600; font-size: 11.5px; text-transform: uppercase; background: #0a0a0a; white-space: nowrap; }
  td { padding: 12px 18px; color: #c0c0d0; white-space: nowrap; vertical-align: middle; }
  tr:hover td { background: #16162a; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; background: #202020; color: #b0b0c8; }
  .tag.activo { background: #14331f; color: #4ade80; }
  .tag.inactivo { background: #3a240f; color: #f97316; }
  .tag.medio { background: #3a2a1a; color: #fbbf24; }
  .tag.alto { background: #3a240f; color: #f97316; }
  .tag.bajo { background: #1a2a3a; color: #60a5fa; }
  .actions-cell { display: flex; gap: 6px; }
  .empty-state { padding: 40px 20px; text-align: center; color: #6a6a85; font-size: 14px; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #8a8aa0; gap: 12px; font-size: 14px; }
  .loading i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(6px); }
  .modal-overlay.show { display: flex; }
  .modal { background: #101010; border-radius: 16px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); }
  .modal.modal-wide { max-width: 950px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #242424; flex-shrink: 0; }
  .modal-header h3 { color: #f0f0f5; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .modal-header h3 i { color: #f97316; }
  .modal-close { background: transparent; border: none; color: #8a8aa0; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .modal-close:hover { background: #181818; color: #fff; }
  .modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fields-grid .field-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: #9a9ab0; font-size: 12.5px; font-weight: 500; text-transform: capitalize; }
  .field input, .field select, .field textarea { background: #080808; border: 1px solid #282828; border-radius: 10px; padding: 10px 14px; color: #e0e0f0; font-size: 13.5px; outline: none; font-family: inherit; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #f97316; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-checkbox { flex-direction: row; align-items: center; gap: 10px; }
  .field-checkbox input { width: auto; accent-color: #f97316; }
  .field input[readonly] { opacity: 0.85; cursor: not-allowed; background: #0a0a14; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #242424; flex-shrink: 0; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: #181818; color: #e0e0f0; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); animation: slideIn 0.25s ease; min-width: 260px; }
  .toast.success { border-left: 3px solid #4ade80; }
  .toast.error { border-left: 3px solid #f97316; }
  .toast.info { border-left: 3px solid #60a5fa; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333333; border-radius: 10px; }

  @media (max-width: 800px) {
    .sidebar { width: 72px; }
    .sidebar .nav-item span, .sidebar .sidebar-brand span, .sidebar-footer span { display: none; }
    .sidebar .nav-item { justify-content: center; padding: 11px 0; }
    .sidebar-footer { justify-content: center; }
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .page-header h2 { font-size: 18px; }
    .fields-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-gamepad"></i>
      <span>Game<span class="accent"> Admin</span></span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" data-section="categories"><i class="fas fa-gamepad"></i><span>Categorías</span></button>
      <button class="nav-item" data-section="packages"><i class="fas fa-box"></i><span>Paquetes</span></button>
      <button class="nav-item" data-section="requirements"><i class="fas fa-list-check"></i><span>Requisitos</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <span>Administrador</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        <h1><i class="fas fa-shield-halved"></i> <span id="pageTitle">Panel de Administración</span></h1>
      </div>
      <div class="topbar-right">
        <span class="badge" id="connStatus"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;margin-right:6px;"></i>Conectado</span>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading"><i class="fas fa-spinner"></i> Cargando...</div>
    </div>
  </main>
</div>

<!-- MODAL CRUD -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-plus"></i> Nuevo registro</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// =============================================
// SUPABASE
// =============================================
const SUPABASE_URL = 'https://aleadadisazocjovibeh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWFkYWRpc2F6b2Nqb3ZpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDE5NjMsImV4cCI6MjA3NTAxNzk2M30.z82tP0C-UiiNuzP_jqrQf4LBusFqrDi1WYbdnuTh47E';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =============================================
// ESQUEMA DE TABLAS
// =============================================
const SCHEMA = {
  categories: {
    table: 'game_categories',
    label: 'Categorías',
    singular: 'Categoría',
    icon: 'fa-gamepad',
    pk: 'id',
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'name', label: 'Nombre', type: 'text', required: true },
      { key: 'description', label: 'Descripción', type: 'textarea', full: true },
      { key: 'icon', label: 'Icono (Font Awesome)', type: 'text', placeholder: 'fa-gamepad' },
      { key: 'color', label: 'Color', type: 'color' },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['id', 'name', 'description', 'icon', 'color', 'is_active'],
  },
  packages: {
    table: 'game_packages',
    label: 'Paquetes',
    singular: 'Paquete',
    icon: 'fa-box',
    pk: 'id',
    joinSelect: '*, game_categories(name)',
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'category_id', label: 'Categoría', type: 'select-fk', fk: 'categories', required: true },
      { key: 'name', label: 'Nombre', type: 'text', required: true },
      { key: 'description', label: 'Descripción', type: 'textarea', full: true },
      { key: 'price', label: 'Precio', type: 'number', step: '0.01', required: true },
      { key: 'original_price', label: 'Precio Original', type: 'number', step: '0.01' },
      { key: 'discount_percentage', label: 'Descuento (%)', type: 'number' },
      { key: 'stock', label: 'Stock', type: 'number' },
      { key: 'image_url', label: 'URL de Imagen', type: 'text', full: true },
      { key: 'is_featured', label: 'Destacado', type: 'boolean' },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['id', 'name', 'category_id', 'price', 'discount_percentage', 'stock', 'is_featured', 'is_active'],
  },
  requirements: {
    table: 'game_category_requirements',
    label: 'Requisitos',
    singular: 'Requisito',
    icon: 'fa-list-check',
    pk: 'id',
    joinSelect: '*, game_categories(name)',
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'category_id', label: 'Categoría', type: 'select-fk', fk: 'categories', required: true },
      { key: 'field_name', label: 'Nombre del Campo', type: 'text', required: true },
      { key: 'field_label', label: 'Etiqueta', type: 'text', required: true },
      { key: 'field_type', label: 'Tipo', type: 'select', options: ['text','email','number','select','textarea'] },
      { key: 'field_options', label: 'Opciones (separadas por coma)', type: 'text', full: true },
      { key: 'placeholder', label: 'Placeholder', type: 'text' },
      { key: 'help_text', label: 'Texto de Ayuda', type: 'textarea', full: true },
      { key: 'sort_order', label: 'Orden', type: 'number' },
      { key: 'is_required', label: 'Requerido', type: 'boolean' },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['id', 'field_name', 'field_label', 'category_id', 'field_type', 'is_required', 'sort_order', 'is_active'],
  },
};

// =============================================
// ESTADO
// =============================================
let currentSection = 'dashboard';
let currentData = [];
let editingId = null;
let currentTableKey = null;
let categoriesCache = [];

const $ = (s) => document.querySelector(s);
const content = $('#content');
const modalOverlay = $('#modalOverlay');
const modalTitle = $('#modalTitle');
const modalBody = $('#modalBody');
const modalSave = $('#modalSave');
const modalClose = $('#modalClose');
const modalCancel = $('#modalCancel');

// =============================================
// UTILIDADES
// =============================================
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
  $('#toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getCategoryName(id) {
  const cat = categoriesCache.find(c => c.id === id);
  return cat ? cat.name : '—';
}

// =============================================
// NAVEGACIÓN
// =============================================
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSection = btn.dataset.section;
    renderSection(currentSection);
  });
});

$('#toggleSidebar').addEventListener('click', () => {
  $('#sidebar').classList.toggle('collapsed');
});

// =============================================
// RENDER
// =============================================
async function renderSection(section) {
  content.innerHTML = `<div class="loading"><i class="fas fa-spinner"></i> Cargando ${section}...</div>`;
  try {
    if (section === 'dashboard') return await renderDashboard();
    if (SCHEMA[section]) return await renderTable(section);
    content.innerHTML = `<div class="empty-state">Sección no encontrada</div>`;
  } catch (err) {
    console.error(err);
    content.innerHTML = `<div class="empty-state" style="color:#f97316;">Error: ${escapeHtml(err.message)}</div>`;
    toast(err.message, 'error');
  }
}

async function loadCategoriesCache() {
  if (categoriesCache.length) return categoriesCache;
  const { data, error } = await db.from('game_categories').select('*').order('name');
  if (error) throw error;
  categoriesCache = data || [];
  return categoriesCache;
}

async function renderDashboard() {
  await loadCategoriesCache();
  const [cats, packs, reqs] = await Promise.all([
    db.from('game_categories').select('*', { count: 'exact', head: true }),
    db.from('game_packages').select('*', { count: 'exact', head: true }),
    db.from('game_category_requirements').select('*', { count: 'exact', head: true }),
  ]);
  const { count: featured } = await db.from('game_packages').select('*', { count: 'exact', head: true }).eq('is_featured', true);

  // Resumen general
  const { data: allPackages } = await db.from('game_packages').select('category_id, is_active');
  const { data: allReqs } = await db.from('game_category_requirements').select('category_id');

  const cards = [
    { label: 'Categorías', value: cats.count || 0, icon: 'fa-gamepad', color: '#f97316' },
    { label: 'Paquetes', value: packs.count || 0, icon: 'fa-box', color: '#fbbf24' },
    { label: 'Requisitos', value: reqs.count || 0, icon: 'fa-list-check', color: '#4ade80' },
    { label: 'Destacados', value: featured || 0, icon: 'fa-star', color: '#a78bfa' },
  ];

  const summaryRows = categoriesCache.map(cat => {
    const p = (allPackages || []).filter(x => x.category_id === cat.id).length;
    const r = (allReqs || []).filter(x => x.category_id === cat.id).length;
    return `
      <tr>
        <td>
          <i class="fas ${cat.icon || 'fa-gamepad'}" style="color:${cat.color || '#f97316'};margin-right:10px;"></i>
          ${escapeHtml(cat.name)}
        </td>
        <td>${p}</td>
        <td>${r}</td>
        <td>${cat.is_active ? '<span class="tag activo">Activo</span>' : '<span class="tag inactivo">Inactivo</span>'}</td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas fa-chart-pie"></i> Dashboard</h2>
      <span class="badge" style="background:#181818;color:#8a8aa0;padding:6px 14px;border-radius:20px;font-size:12px;">Resumen general</span>
    </div>
    <div class="stats-grid">
      ${cards.map(c => `
        <div class="stat-card">
          <div class="icon-wrap">
            <span class="label">${c.label}</span>
            <i class="fas ${c.icon}" style="color:${c.color}"></i>
          </div>
          <span class="value">${c.value}</span>
        </div>
      `).join('')}
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Categoría</th>
              <th>Paquetes</th>
              <th>Requisitos</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            ${summaryRows || `<tr><td colspan="4" class="empty-state">No hay categorías</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function renderTable(tableKey) {
  currentTableKey = tableKey;
  const schema = SCHEMA[tableKey];
  await loadCategoriesCache();

  let query = db.from(schema.table).select(schema.joinSelect || '*');
  query = query.order(schema.pk, { ascending: false }).limit(200);
  const { data, error } = await query;
  if (error) throw error;
  currentData = data || [];

  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas ${schema.icon}"></i> ${schema.label}</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="btnNew"><i class="fas fa-plus"></i> Nuevo</button>
        <button class="btn" id="btnRefresh"><i class="fas fa-sync"></i> Refrescar</button>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              ${schema.listFields.map(f => `<th>${schema.columns.find(c => c.key === f)?.label || f}</th>`).join('')}
              <th style="text-align:right;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${currentData.length ? currentData.map(row => `
              <tr>
                ${schema.listFields.map(f => `<td>${renderCell(row, f, schema)}</td>`).join('')}
                <td>
                  <div class="actions-cell" style="justify-content:flex-end;">
                    <button class="btn btn-sm" data-edit="${row[schema.pk]}" title="Editar"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm btn-danger" data-del="${row[schema.pk]}" title="Eliminar"><i class="fas fa-trash"></i></button>
                  </div>
                </td>
              </tr>
            `).join('') : `<tr><td colspan="${schema.listFields.length + 1}" class="empty-state">No hay registros</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('btnNew').onclick = () => openModal(tableKey, null);
  document.getElementById('btnRefresh').onclick = () => renderSection(tableKey);

  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      const row = currentData.find(r => String(r[schema.pk]) === b.dataset.edit);
      openModal(tableKey, row);
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => deleteRecord(tableKey, b.dataset.del);
  });
}

function renderCell(row, fieldKey, schema) {
  const col = schema.columns.find(c => c.key === fieldKey);
  let value = row[fieldKey];

  // FK display
  if (col?.type === 'select-fk') {
    if (fieldKey === 'category_id') return escapeHtml(getCategoryName(value));
  }

  if (value === null || value === undefined || value === '') return '—';

  if (col?.type === 'boolean') return value ? '<span class="tag activo">Sí</span>' : '<span class="tag inactivo">No</span>';

  if (fieldKey === 'discount_percentage' && Number(value) > 0)
    return `<span class="tag activo">-${value}%</span>`;
  if (fieldKey === 'is_featured') return value ? '<span class="tag activo">⭐ Destacado</span>' : '<span class="tag">Normal</span>';
  if (fieldKey === 'is_active') return value ? '<span class="tag activo">Activo</span>' : '<span class="tag inactivo">Inactivo</span>';
  if (fieldKey === 'color') return `<span style="display:inline-block;width:22px;height:22px;background:${escapeHtml(value)};border-radius:6px;vertical-align:middle;"></span> ${escapeHtml(value)}`;
  if (fieldKey === 'icon') return `<i class="fas ${escapeHtml(value)}" style="color:#f97316;font-size:16px;"></i> ${escapeHtml(value)}`;
  if (fieldKey === 'field_type') return `<span class="tag">${escapeHtml(value)}</span>`;
  if (fieldKey === 'price' || fieldKey === 'original_price') return `$${escapeHtml(value)}`;

  return escapeHtml(value);
}

// =============================================
// MODAL CRUD
// =============================================
function openModal(tableKey, row) {
  const schema = SCHEMA[tableKey];
  editingId = row ? row[schema.pk] : null;
  currentTableKey = tableKey;

  modalTitle.innerHTML = row
    ? `<i class="fas fa-pen"></i> Editar ${schema.singular}`
    : `<i class="fas fa-plus"></i> Nuevo ${schema.singular}`;

  const fields = schema.columns.filter(c => !['created_at','updated_at'].includes(c.key));
  let html = '<div class="fields-grid">';

  fields.forEach(col => {
    const val = row ? row[col.key] : '';
    const full = col.full || col.type === 'textarea' ? ' field-full' : '';
    if (col.type === 'readonly') return;

    if (col.type === 'textarea') {
      html += `<div class="field${full}"><label>${col.label}</label><textarea data-key="${col.key}" ${col.required ? 'required' : ''}>${escapeHtml(val ?? '')}</textarea></div>`;
    } else if (col.type === 'select') {
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}">
          <option value="">— Seleccionar —</option>
          ${col.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select></div>`;
    } else if (col.type === 'select-fk') {
      const cache = col.fk === 'categories' ? categoriesCache : [];
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}" ${col.required ? 'required' : ''}>
          <option value="">— Seleccionar —</option>
          ${cache.map(o => `<option value="${o.id}" ${val === o.id ? 'selected' : ''}>${escapeHtml(o.name)}</option>`).join('')}
        </select></div>`;
    } else if (col.type === 'boolean') {
      html += `<div class="field field-checkbox${full}"><input type="checkbox" data-key="${col.key}" id="chk_${col.key}" ${val ? 'checked' : ''}><label for="chk_${col.key}" style="text-transform:none;">${col.label}</label></div>`;
    } else {
      const inputType = col.type === 'number' ? 'number' : col.type === 'color' ? 'color' : col.type === 'email' ? 'email' : col.type === 'date' ? 'date' : 'text';
      const step = col.step ? `step="${col.step}"` : '';
      const ph = col.placeholder ? `placeholder="${col.placeholder}"` : '';
      html += `<div class="field${full}"><label>${col.label}</label>
        <input type="${inputType}" data-key="${col.key}" value="${escapeHtml(val ?? '')}" ${col.required ? 'required' : ''} ${step} ${ph}>
      </div>`;
    }
  });
  html += '</div>';

  modalBody.innerHTML = html;
  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  modalBody.innerHTML = '';
  editingId = null;
  currentTableKey = null;
}

modalClose.onclick = closeModal;
modalCancel.onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

// =============================================
// GUARDAR
// =============================================
modalSave.onclick = async () => {
  if (!currentTableKey) return;
  const schema = SCHEMA[currentTableKey];
  const payload = {};
  let valid = true;

  modalBody.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const col = schema.columns.find(c => c.key === key);
    if (!col) return;
    if (col.type === 'readonly') return;

    let val;
    if (col.type === 'boolean') val = el.checked;
    else if (col.type === 'number') {
      val = el.value === '' ? null : Number(el.value);
      if (val !== null && isNaN(val)) val = null;
    } else val = el.value === '' ? null : el.value;

    if (col.required && (val === null || val === '')) {
      toast(`El campo "${col.label}" es obligatorio`, 'error');
      valid = false;
    }
    payload[key] = val;
  });

  if (!valid) return;

  try {
    modalSave.disabled = true;
    modalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

    if (editingId !== null) {
      const { error } = await db.from(schema.table).update(payload).eq(schema.pk, editingId);
      if (error) throw error;
      toast('Registro actualizado', 'success');
    } else {
      const { error } = await db.from(schema.table).insert([payload]);
      if (error) throw error;
      toast('Registro creado', 'success');
    }
    const table = currentTableKey;
    closeModal();
    await renderSection(table);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  } finally {
    modalSave.disabled = false;
    modalSave.innerHTML = '<i class="fas fa-save"></i> Guardar';
  }
};

// =============================================
// ELIMINAR
// =============================================
async function deleteRecord(tableKey, id) {
  const schema = SCHEMA[tableKey];
  if (!confirm(`¿Eliminar registro #${id} de ${schema.label}?`)) return;
  try {
    const { error } = await db.from(schema.table).delete().eq(schema.pk, id);
    if (error) throw error;
    toast('Registro eliminado', 'success');
    await renderSection(tableKey);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

// =============================================
// INIT
// =============================================
(async function init() {
  try {
    const { error } = await db.from('game_categories').select('id', { count: 'exact', head: true });
    if (error) throw error;
    await renderDashboard();
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#f97316;font-size:8px;margin-right:6px;"></i>Error de conexión';
    content.innerHTML = `<div class="empty-state" style="color:#f97316;">
      <i class="fas fa-exclamation-circle" style="font-size:36px;display:block;margin-bottom:12px;"></i>
      Error al conectar con Supabase: ${escapeHtml(err.message)}
    </div>`;
  }
})();
</script>
