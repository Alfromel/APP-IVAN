<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokTok Admin | Sistema de Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0612; }
  body { display: flex; align-items: stretch; justify-content: stretch; }
  .app { width: 100%; max-width: 100vw; height: 100vh; display: flex; overflow: hidden; background: #0a0612; }

  /* ===== SIDEBAR ===== */
  .sidebar { width: 260px; background: linear-gradient(180deg, #120a1f 0%, #0d0616 100%); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s ease; overflow: hidden; border-right: 1px solid #2a1a3f; }
  .sidebar.collapsed { width: 72px; }
  .sidebar-brand { padding: 22px 22px 18px; display: flex; align-items: center; gap: 12px; color: #f0eaf8; font-weight: 700; font-size: 17px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-brand i { color: #a855f7; font-size: 24px; min-width: 28px; text-align: center; filter: drop-shadow(0 0 8px rgba(168,85,247,0.5)); }
  .sidebar-brand span.accent { color: #a855f7; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; overflow-y: auto; overflow-x: hidden; }
  .nav-section { padding: 14px 14px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: #5a4a70; font-weight: 700; white-space: nowrap; }
  .sidebar.collapsed .nav-section { display: none; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; color: #9a8ab0; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; background: transparent; text-align: left; width: 100%; white-space: nowrap; overflow: hidden; }
  .nav-item i { font-size: 17px; min-width: 22px; text-align: center; color: #6a5a85; transition: color 0.15s; }
  .nav-item:hover { background: #1e1230; color: #d0c0e0; }
  .nav-item:hover i { color: #a855f7; }
  .nav-item.active { background: linear-gradient(90deg, #2a1a4a 0%, #1e1235 100%); color: #fff; box-shadow: inset 3px 0 0 #a855f7; }
  .nav-item.active i { color: #a855f7; }
  .sidebar.collapsed .nav-item span, .sidebar.collapsed .sidebar-brand span { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
  .sidebar-footer { padding: 16px 18px; border-top: 1px solid #2a1a3f; display: flex; align-items: center; gap: 12px; color: #6a5a85; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-footer .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex-shrink: 0; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
  .sidebar.collapsed .sidebar-footer span { display: none; }
  .sidebar.collapsed .sidebar-footer { justify-content: center; }

  /* ===== MAIN ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: #0a0612; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: rgba(18, 10, 31, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #2a1a3f; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .toggle-btn { background: transparent; border: none; color: #8a7aa0; font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: 8px; transition: all 0.15s; }
  .toggle-btn:hover { background: #1e1230; color: #a855f7; }
  .topbar h1 { color: #e8e0f0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
  .topbar h1 i { color: #a855f7; font-size: 20px; }
  .topbar-right .badge { background: #1e1230; color: #9a8ab0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #2a1a3f; }
  .content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 24px 28px 40px; }

  /* ===== PAGE HEADER ===== */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-header h2 { color: #f0eaf8; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
  .page-header h2 i { color: #a855f7; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
  .export-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ===== BUTTONS ===== */
  .btn { background: #1e1230; border: 1px solid #2a1a3f; color: #d0c0e0; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: #2a1a45; color: #fff; border-color: #3a2a55; }
  .btn-primary { background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); color: #fff; border: none; box-shadow: 0 4px 14px rgba(168,85,247,0.3); }
  .btn-primary:hover { background: linear-gradient(135deg, #9333ea 0%, #6d28d9 100%); box-shadow: 0 6px 20px rgba(168,85,247,0.45); transform: translateY(-1px); }
  .btn-success { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: #fff; border: none; box-shadow: 0 4px 14px rgba(22,163,74,0.3); }
  .btn-success:hover { background: linear-gradient(135deg, #15803d 0%, #166534 100%); box-shadow: 0 6px 20px rgba(22,163,74,0.45); transform: translateY(-1px); }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-export { padding: 9px 14px; font-size: 12px; font-weight: 600; border-radius: 10px; border: none; }
  .btn-export.excel { background: linear-gradient(135deg, #166534 0%, #14532d 100%); color: #dcfce7; box-shadow: 0 4px 12px rgba(22,163,74,0.25); }
  .btn-export.excel:hover { background: linear-gradient(135deg, #15803d 0%, #166534 100%); color: #fff; box-shadow: 0 6px 18px rgba(22,163,74,0.4); transform: translateY(-1px); }
  .btn-export.pdf { background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%); color: #fee2e2; box-shadow: 0 4px 12px rgba(220,38,38,0.25); }
  .btn-export.pdf:hover { background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%); color: #fff; box-shadow: 0 6px 18px rgba(220,38,38,0.4); transform: translateY(-1px); }

  /* ===== STATS ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: linear-gradient(160deg, #1a0f2e 0%, #120a1f 100%); border: 1px solid #2a1a3f; border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #a855f7, transparent); opacity: 0.7; }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.15); }
  .stat-card .label { color: #8a7aa0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { color: #fff; font-size: 30px; font-weight: 700; }
  .stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
  .stat-card .icon-wrap i { font-size: 24px; opacity: 0.9; }

  /* ===== TRANSFER CARD ===== */
  .transfer-card { max-width: 820px; margin: 12px auto 0; background: linear-gradient(180deg, #1a0f2e 0%, #120a1f 100%); border: 1px solid #2a1a3f; border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(168,85,247,0.08); overflow: hidden; }
  .transfer-card .panel-body { padding: 28px; }
  .transfer-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .transfer-form-grid .field-full { grid-column: 1 / -1; }

  /* ===== PANEL ===== */
  .panel-header { padding: 16px 22px; border-bottom: 1px solid #2a1a3f; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .panel-title { color: #f0eaf8; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .panel-title i { color: #a855f7; }
  .panel-body { padding: 20px 22px; }

  /* ===== SEARCH ===== */
  .search-input { background: #160e26; border: 1px solid #2a1a3f; color: #e0d8f0; padding: 9px 14px; border-radius: 10px; font-size: 13px; outline: none; min-width: 0; width: min(220px, 100%); max-width: 100%; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
  .search-input:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
  .search-input::placeholder { color: #6a5a85; }

  /* ===== TABLE ===== */
  .table-wrap { background: linear-gradient(180deg, #160e26 0%, #120a1f 100%); border-radius: 16px; overflow: hidden; border: 1px solid #2a1a3f; }
  .table-scroll { overflow-x: auto; min-width: 0; }
  table { width: 100%; max-width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13.5px; }
  th { text-align: left; padding: 14px 18px; color: #8a7aa0; font-weight: 600; font-size: 11.5px; text-transform: uppercase; background: #120a1f; white-space: normal; overflow-wrap: anywhere; letter-spacing: 0.5px; border-bottom: 1px solid #2a1a3f; }
  td { padding: 13px 18px; color: #c0b0d0; white-space: normal; overflow-wrap: anywhere; word-break: break-word; vertical-align: middle; border-bottom: 1px solid #1e1230; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1e1230; }
  .tag { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 600; background: #1e1230; color: #b0a0c8; letter-spacing: 0.2px; }
  .tag.info { background: #2a1a4a; color: #c084fc; }
  .tag.pending { background: #3a2a1a; color: #fbbf24; }
  .tag.completed { background: #14331f; color: #4ade80; }
  .tag.failed { background: #3a1a1a; color: #f87171; }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  .table-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2a1a3f; background: #1a0f2e; color: #dfe3ee; cursor: pointer; transition: all 0.15s ease; }
  .table-action-btn:hover { transform: translateY(-1px); }
  .table-action-btn.edit { background: #1d2f1a; color: #7ae6a8; border-color: rgba(122,230,168,0.3); }
  .table-action-btn.edit:hover { background: #24401f; box-shadow: 0 4px 12px rgba(122,230,168,0.2); }
  .table-action-btn.delete { background: #2d1b1b; color: #ff8a8a; border-color: rgba(255,138,138,0.3); }
  .table-action-btn.delete:hover { background: #3d2020; box-shadow: 0 4px 12px rgba(255,138,138,0.2); }
  .empty-state { padding: 40px 20px; text-align: center; color: #6a5a85; font-size: 14px; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #8a7aa0; gap: 12px; font-size: 14px; }
  .loading i { animation: spin 1s linear infinite; color: #a855f7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== MODAL ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(5, 2, 10, 0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(8px); }
  .modal-overlay.show { display: flex; }
  .modal { background: linear-gradient(180deg, #1a0f2e 0%, #120a1f 100%); border-radius: 18px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(168,85,247,0.15); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #2a1a3f; flex-shrink: 0; }
  .modal-header h3 { color: #f0eaf8; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .modal-header h3 i { color: #a855f7; }
  .modal-close { background: transparent; border: none; color: #8a7aa0; font-size: 20px; cursor: pointer; padding: 4px 10px; border-radius: 8px; transition: all 0.15s; }
  .modal-close:hover { background: #1e1230; color: #fff; }
  .modal-body { padding: 22px 24px; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #2a1a3f; flex-shrink: 0; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fields-grid .field-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .field label { color: #9a8ab0; font-size: 12.5px; font-weight: 600; text-transform: capitalize; letter-spacing: 0.2px; }
  .field input, .field select, .field textarea { background: #160e26; border: 1px solid #2a1a3f; border-radius: 10px; padding: 10px 14px; color: #e0d8f0; font-size: 13.5px; outline: none; font-family: inherit; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input[readonly] { opacity: 0.85; cursor: not-allowed; background: #0d0616; }

  /* ===== TOAST ===== */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: linear-gradient(135deg, #1e1230 0%, #160e26 100%); color: #e0d8f0; padding: 14px 22px; border-radius: 12px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(168,85,247,0.1); animation: slideIn 0.25s ease; min-width: 280px; }
  .toast.success { border-left: 3px solid #4ade80; }
  .toast.error { border-left: 3px solid #f87171; }
  .toast.info { border-left: 3px solid #a855f7; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a1a3f; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a2a55; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 800px) {
    .sidebar { width: 72px; }
    .sidebar .nav-item span, .sidebar .sidebar-brand span, .sidebar-footer span, .nav-section { display: none; }
    .sidebar .nav-item { justify-content: center; padding: 11px 0; }
    .sidebar-footer { justify-content: center; }
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .page-header h2 { font-size: 18px; }
    .fields-grid { grid-template-columns: 1fr; }
    .transfer-form-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-shield-halved"></i>
      <span>TokTok<span class="accent"> Admin</span></span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" data-view="users" onclick="switchView('users')"><i class="fas fa-users"></i><span>Usuarios</span></button>
      <button class="nav-item" data-view="transactions" onclick="switchView('transactions')"><i class="fas fa-money-bill-wave"></i><span>Transacciones</span></button>
      <button class="nav-item" data-view="transfer" onclick="switchView('transfer')"><i class="fas fa-paper-plane"></i><span>Transferir</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <span>Administrador</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        <h1><i class="fas fa-shield-halved"></i> <span id="pageTitle">Panel de Administración</span></h1>
      </div>
      <div class="topbar-right">
        <span class="badge" id="connStatus"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;"></i>Conectando...</span>
      </div>
    </div>
    <div class="content" id="contentArea">
      <div class="loading"><i class="fas fa-spinner"></i> Cargando...</div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-plus"></i> Nuevo registro</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// =============================================
// SUPABASE - TUS CREDENCIALES
// =============================================
const SUPABASE_URL = 'https://aleadadisazocjovibeh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWFkYWRpc2F6b2Nqb3ZpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDE5NjMsImV4cCI6MjA3NTAxNzk2M30.z82tP0C-UiiNuzP_jqrQf4LBusFqrDi1WYbdnuTh47E';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

// =============================================
// NOMBRES DE TUS TABLAS
// =============================================
const TABLA_USUARIOS = 'user_profiles';
const TABLA_TRANSACCIONES = 'transacciones';

// =============================================
// ESQUEMAS
// =============================================
const SCHEMA = {
  users: {
    table: TABLA_USUARIOS,
    label: 'Usuarios',
    singular: 'Usuario',
    icon: 'fa-users',
    pk: 'id',
    order: { column: 'created_at', ascending: false },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'full_name', label: 'Nombre completo', type: 'text' },
      { key: 'email', label: 'Email', type: 'email' },
      { key: 'phone', label: 'Teléfono', type: 'text' },
      { key: 'balance', label: 'Saldo (Bs)', type: 'balance', readonly: true },
    ],
    listFields: ['id', 'full_name', 'email', 'phone', 'balance', 'created_at'],
  },
  transactions: {
    table: TABLA_TRANSACCIONES,
    label: 'Transacciones',
    singular: 'Transacción',
    icon: 'fa-money-bill-wave',
    pk: 'id',
    order: { column: 'creado_en', ascending: false },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'usuario_id', label: 'Usuario', type: 'text', readonly: true },
      { key: 'monto', label: 'Monto (Bs)', type: 'number', step: '0.01' },
      { key: 'tipo', label: 'Tipo', type: 'select', options: ['deposito','retiro','transferencia','recarga'] },
      { key: 'estado', label: 'Estado', type: 'select', options: ['pendiente','completado','fallido'] },
      { key: 'descripcion', label: 'Descripción', type: 'textarea', full: true },
    ],
    listFields: ['id', 'usuario_id', 'monto', 'tipo', 'estado', 'descripcion', 'creado_en'],
  },
};

// =============================================
// ESTADO
// =============================================
let currentSection = 'dashboard';
let currentData = [];
let editingId = null;
let currentTableKey = null;
let cache = { users: [], transactions: [], userBalances: {} };

const $ = (s) => document.querySelector(s);
const content = $('#contentArea');
const modalOverlay = $('#modalOverlay');
const modalTitle = $('#modalTitle');
const modalBody = $('#modalBody');
const modalSave = $('#modalSave');
const modalClose = $('#modalClose');
const modalCancel = $('#modalCancel');

// =============================================
// UTILIDADES
// =============================================
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
  $('#toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleDateString('es-BO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return d; }
}

function formatBs(amount) {
  return 'Bs ' + parseFloat(amount || 0).toFixed(2);
}

function translateTransactionType(type) {
  return ({ deposito: 'Depósito', retiro: 'Retiro', transferencia: 'Transferencia', recarga: 'Recarga' })[type] || type || '—';
}

function translateTransactionStatus(status) {
  return ({ pendiente: 'Pendiente', completado: 'Completada', fallido: 'Fallida' })[status] || status || '—';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getUserNameById(userId) {
  if (!userId) return '—';
  const user = cache.users?.find(u => String(u.id) === String(userId));
  if (!user) return String(userId).substring(0, 10) + '...';
  return user.full_name || user.email || user.id;
}

// =============================================
// CARGA DE DATOS
// =============================================
async function fetchAllRecords(table, select = '*', filters = []) {
  const pageSize = 1000;
  const records = [];

  for (let offset = 0; ; offset += pageSize) {
    let query = db.from(table).select(select).range(offset, offset + pageSize - 1);
    for (const filter of filters) {
      if (!filter || typeof query[filter.method] !== 'function') continue;
      query = query[filter.method](...(filter.args || []));
    }

    const { data, error } = await query;
    if (error) throw error;
    records.push(...(data || []));
    if (!data || data.length < pageSize) return records;
  }
}

async function calculateUserBalances() {
  try {
    const [users, transactions] = await Promise.all([
      fetchAllRecords(TABLA_USUARIOS, 'id'),
      fetchAllRecords(TABLA_TRANSACCIONES, 'usuario_id, tipo, monto, estado, metadata'),
    ]);
    const balances = Object.fromEntries((users || []).map(user => [user.id, 0]));

    for (const transaction of transactions || []) {
      if (transaction.estado !== 'completado') continue;
      const amount = Number(transaction.monto);
      if (!Number.isFinite(amount)) continue;

      if (transaction.tipo === 'deposito' || transaction.tipo === 'recarga') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] += amount;
      } else if (transaction.tipo === 'retiro') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] -= amount;
      } else if (transaction.tipo === 'transferencia') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] -= amount;
        const recipientId = transaction.metadata?.to_user_id || transaction.metadata?.destinatario_id;
        if (recipientId && recipientId in balances) balances[recipientId] += amount;
      }
    }

    return balances;
  } catch (err) {
    console.error('Error al calcular saldos:', err);
    return {};
  }
}

async function loadAllData() {
  try {
    const [users, txs] = await Promise.all([
      fetchAllRecords(TABLA_USUARIOS, '*', [
        { method: 'order', args: ['created_at', { ascending: false }] },
      ]),
      fetchAllRecords(TABLA_TRANSACCIONES, '*', [
        { method: 'order', args: ['creado_en', { ascending: false }] },
      ]),
    ]);

    cache.users = users || [];
    cache.transactions = txs || [];
    cache.userBalances = await calculateUserBalances();

    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#4ade80;font-size:8px;"></i>Conectado';
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:8px;"></i>Error';
    toast('Error al cargar datos: ' + err.message, 'error');
  }
}

  renderSection(currentSection);
}

    ? [...(cache.users || [])].sort((a, b) =>
        Number(cache.userBalances[b.id] || 0) - Number(cache.userBalances[a.id] || 0)
      )
    : cache[tableKey] || [];

  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas ${schema.icon}"></i> ${schema.label}</h2>
      <div class="header-actions">
        <input type="text" class="search-input" id="searchBox" placeholder="Buscar...">
        ${['users', 'transactions'].includes(tableKey) ? `
          <div class="export-actions">
            <button class="btn btn-export excel" id="btnExportExcel" title="Descargar todos los registros en Excel"><i class="fas fa-file-excel"></i> Excel</button>
            <button class="btn btn-export pdf" id="btnExportPdf" title="Descargar todos los registros en PDF"><i class="fas fa-file-pdf"></i> PDF</button>

      <div class="table-scroll">
        <table>
          <thead>

              <th style="text-align:right;">Acciones</th>

  const btnNew = $('#btnNew');
  if (btnNew) btnNew.onclick = () => openModal(tableKey, null);

  const btnExportExcel = $('#btnExportExcel');

  const btnExportPdf = $('#btnExportPdf');
  if (btnExportPdf) btnExportPdf.onclick = () => exportTableToPdf(tableKey);

  const btnRefresh = $('#btnRefresh');

function getExportData(tableKey) {
  const rows = tableKey === 'users'
    ? [...(cache.users || [])].sort((a, b) => Number(cache.userBalances[b.id] || 0) - Number(cache.userBalances[a.id] || 0))
    : cache.transactions || [];

  if (tableKey === 'users') {

      title: 'Usuarios',
      fileName: 'usuarios-toktok',

        user.id || '', user.full_name || '', user.email || '', user.phone || '',
        Number(cache.userBalances[user.id] || 0).toFixed(2), formatDate(user.created_at),
      ]),
    };

  return {
    title: 'Transacciones',
    fileName: 'transacciones-toktok',
    columns: ['ID', 'Usuario', 'Monto (Bs)', 'Tipo', 'Estado', 'Descripción', 'Fecha'],
    data: rows.map(transaction => [
      transaction.id || '', getUserNameById(transaction.usuario_id), Number(transaction.monto || 0),
      translateTransactionType(transaction.tipo), translateTransactionStatus(transaction.estado),
      transaction.descripcion || '', formatDate(transaction.creado_en),
    ]),
  };
}

/* =============================================
   EXPORTAR A EXCEL (diseño mejorado morado)
   ============================================= */
function exportTableToExcel(tableKey) {
  const exportData = getExportData(tableKey);
  if (!window.XLSX) return toast('No se pudo cargar el exportador de Excel', 'error');

  const data = [exportData.columns, ...exportData.data];
  const worksheet = XLSX.utils.aoa_to_sheet(data);

  worksheet['!cols'] = exportData.columns.map((column, index) => ({
    wch: Math.min(40, Math.max(column.length + 4, ...exportData.data.slice(0, 100).map(row => String(row[index] ?? '').length + 4))),
  }));

  worksheet['!rows'] = [{ hpt: 28 }];
  const range = XLSX.utils.decode_range(worksheet['!ref']);
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cellAddress = XLSX.utils.encode_cell({ r: 0, c });
    if (!worksheet[cellAddress]) continue;
    worksheet[cellAddress].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 12 },
      fill: { fgColor: { rgb: '7C3AED' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: {
        top: { style: 'thin', color: { rgb: 'A855F7' } },
        bottom: { style: 'thin', color: { rgb: 'A855F7' } },
        left: { style: 'thin', color: { rgb: 'A855F7' } },
        right: { style: 'thin', color: { rgb: 'A855F7' } },
      },
    };
  }

  for (let r = 1; r <= range.e.r; r++) {
    const fillColor = r % 2 === 0 ? 'F3E8FF' : 'FFFFFF';
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cellAddress = XLSX.utils.encode_cell({ r, c });
      if (!worksheet[cellAddress]) worksheet[cellAddress] = { t: 's', v: '' };
      worksheet[cellAddress].s = {
        fill: { fgColor: { rgb: fillColor } },
        alignment: { vertical: 'center', horizontal: c === 0 ? 'center' : 'left' },
        font: { sz: 11, color: { rgb: '2E1A47' } },
        border: {
          top: { style: 'thin', color: { rgb: 'E9D5FF' } },
          bottom: { style: 'thin', color: { rgb: 'E9D5FF' } },
          left: { style: 'thin', color: { rgb: 'E9D5FF' } },
          right: { style: 'thin', color: { rgb: 'E9D5FF' } },
        },
      };
    }
  }

  worksheet['!freeze'] = { xSplit: '0', ySplit: '1' };
  worksheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: exportData.data.length, c: exportData.columns.length - 1 } }) };

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, exportData.title.substring(0, 31));
  XLSX.writeFile(workbook, `${exportData.fileName}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  toast(`${exportData.data.length} registros exportados a Excel`, 'success');
}

/* =============================================
   EXPORTAR A PDF (diseño mejorado morado)
   ============================================= */
function exportTableToPdf(tableKey) {
  const exportData = getExportData(tableKey);
  const JsPDF = window.jspdf?.jsPDF;
  if (!JsPDF) return toast('No se pudo cargar el exportador de PDF', 'error');

  const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  doc.setFillColor(18, 10, 31);
  doc.rect(0, 0, pageWidth, 32, 'F');
  doc.setFillColor(124, 58, 237);
  doc.rect(0, 30, pageWidth, 2, 'F');

  doc.setTextColor(168, 85, 247);
  doc.setFontSize(20);
  doc.setFont('helvetica', 'bold');
  doc.text('TOKTOK ADMIN', 14, 14);

  doc.setTextColor(220, 210, 240);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(exportData.title.toUpperCase(), 14, 22);

  doc.setTextColor(160, 150, 180);
  doc.setFontSize(9);
  doc.text(`${exportData.data.length} registros · ${new Date().toLocaleString('es-BO')}`, pageWidth - 14, 22, { align: 'right' });

  doc.autoTable({
    head: [exportData.columns],
    body: exportData.data,
    startY: 38,
    margin: { left: 12, right: 12, bottom: 20 },
    styles: { fontSize: 8, cellPadding: 4, textColor: [46, 26, 71], lineColor: [220, 200, 240], lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: [124, 58, 237], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 9, halign: 'center' },
    alternateRowStyles: { fillColor: [245, 235, 255] },
    bodyStyles: { fontSize: 8, cellPadding: 3.5 },
    didParseCell: function (data) {
      if (data.section === 'body' && (data.column.index === 2 || data.column.index === 4 || data.column.index === 5)) {
        data.cell.styles.halign = 'right';
      }
    },
    didDrawPage: function (data) {
      const footerY = pageHeight - 12;
      doc.setFontSize(8);
      doc.setTextColor(140, 130, 160);
      doc.text('TokTok Admin — Gestión de usuarios y transacciones', 12, footerY);
      doc.text(`Página ${data.pageNumber}`, pageWidth - 12, footerY, { align: 'right' });
      doc.setDrawColor(124, 58, 237);
      doc.setLineWidth(0.5);
      doc.line(12, footerY - 4, pageWidth - 12, footerY - 4);
    },
  });

  doc.save(`${exportData.fileName}-${new Date().toISOString().slice(0, 10)}.pdf`);
  toast(`${exportData.data.length} registros exportados a PDF`, 'success');
}

function renderRows(tableKey, rows) {
  const schema = SCHEMA[tableKey];
  if (!rows.length) return `<tr><td colspan="${schema.listFields.length + 1}" class="empty-state">No hay registros</td></tr>`;
  return rows.map(row => `
    <tr>
      ${schema.listFields.map(f => `<td>${renderCell(row, f, schema)}</td>`).join('')}
      <td>
        <div class="actions-cell" style="justify-content:flex-end;">
          ${tableKey === 'users' ? `<button class="table-action-btn" data-clear-history="${row[schema.pk]}" title="Borrar historial y conservar saldo"><i class="fas fa-eraser"></i></button>` : ''}
          <button class="table-action-btn edit" data-edit="${row[schema.pk]}" title="Editar"><i class="fas fa-pen"></i></button>
          <button class="table-action-btn delete" data-del="${row[schema.pk]}" title="Eliminar"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join('');
}

function bindRowActions(tableKey) {
  const schema = SCHEMA[tableKey];
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      const row = currentData.find(r => String(r[schema.pk]) === b.dataset.edit);
      openModal(tableKey, row);
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => deleteRecord(tableKey, b.dataset.del);
  });
  document.querySelectorAll('[data-clear-history]').forEach(b => {
    b.onclick = () => clearUserTransactionHistory(b.dataset.clearHistory);
  });
}

function renderCell(row, fieldKey, schema) {
  const col = schema.columns.find(c => c.key === fieldKey);
  let value = fieldKey === 'balance' ? (cache.userBalances[row.id] ?? 0) : row[fieldKey];

  if (value === null || value === undefined || value === '') return '—';

  if (fieldKey === 'estado' || fieldKey === 'status') {
    const cls = value === 'completado' ? 'completed' : value === 'fallido' ? 'failed' : 'pending';
    return `<span class="tag ${cls}">${escapeHtml(translateTransactionStatus(value))}</span>`;
  }
  if (fieldKey === 'tipo' || fieldKey === 'type') return `<span class="tag info">${escapeHtml(translateTransactionType(value))}</span>`;
  if (fieldKey === 'monto' || fieldKey === 'amount') return `<strong style="color:#fff;">${formatBs(value)}</strong>`;
  if (fieldKey === 'balance') return `<strong style="color:${Number(value) < 0 ? '#f87171' : '#4ade80'};">${formatBs(value)}</strong>`;
  if (fieldKey === 'creado_en' || fieldKey === 'created_at') return formatDate(value);
  if (fieldKey === 'usuario_id' || fieldKey === 'user_id') {
    if (schema && schema.table === TABLA_TRANSACCIONES) {
      return escapeHtml(getUserNameById(value));
    }
    return `<span style="font-family:monospace;font-size:12px;color:#8a7aa0;">${escapeHtml(String(value).substring(0, 10))}...</span>`;
  }
  if (fieldKey === 'id') return `<span style="font-family:monospace;font-size:12px;color:#8a7aa0;">${escapeHtml(String(value).substring(0, 10))}...</span>`;

  return escapeHtml(value);
}

// =============================================
// MODAL CRUD
// =============================================
function openModal(tableKey, row) {
  const schema = SCHEMA[tableKey];
  editingId = row ? row[schema.pk] : null;
  currentTableKey = tableKey;

  modalTitle.innerHTML = row
    ? `<i class="fas fa-pen"></i> Editar ${schema.singular}`
    : `<i class="fas fa-plus"></i> Nuevo ${schema.singular}`;

  const fields = schema.columns.filter(c => !['created_at','updated_at','creado_en'].includes(c.key));
  let html = '<div class="fields-grid">';

  fields.forEach(col => {
    const val = row ? row[col.key] : '';
    const full = col.full || col.type === 'textarea' ? ' field-full' : '';
    if (col.type === 'readonly') return;

    if (col.type === 'textarea') {
      html += `<div class="field${full}"><label>${col.label}</label><textarea data-key="${col.key}" ${col.required ? 'required' : ''}>${escapeHtml(val ?? '')}</textarea></div>`;
    } else if (col.type === 'select') {
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}">
          <option value="">— Seleccionar —</option>
          ${col.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${col.key === 'tipo' ? translateTransactionType(o) : col.key === 'estado' ? translateTransactionStatus(o) : o}</option>`).join('')}
        </select></div>`;
    } else {
      const inputType = col.type === 'number' ? 'number' : col.type === 'email' ? 'email' : 'text';
      const step = col.step ? `step="${col.step}"` : '';
      html += `<div class="field${full}"><label>${col.label}</label>
        <input type="${inputType}" data-key="${col.key}" value="${escapeHtml(val ?? '')}" ${step}>
      </div>`;
    }
  });
  html += '</div>';

  modalBody.innerHTML = html;
  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  modalBody.innerHTML = '';
  editingId = null;
  currentTableKey = null;
}

modalClose.onclick = closeModal;
modalCancel.onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

// =============================================
// GUARDAR
// =============================================
modalSave.onclick = async () => {
  if (!currentTableKey) return;
  const schema = SCHEMA[currentTableKey];
  const payload = {};
  let valid = true;

  modalBody.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const col = schema.columns.find(c => c.key === key);
    if (!col) return;
    if (col.type === 'readonly') return;

    let val;
    if (col.type === 'number') {
      val = el.value === '' ? null : Number(el.value);
      if (val !== null && isNaN(val)) val = null;
    } else val = el.value === '' ? null : el.value;

    if (col.required && (val === null || val === '')) {
      toast(`El campo "${col.label}" es obligatorio`, 'error');
      valid = false;
    }
    payload[key] = val;
  });

  if (!valid) return;

  try {
    modalSave.disabled = true;
    modalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

    if (editingId !== null) {
      const { error } = await db.from(schema.table).update(payload).eq(schema.pk, editingId);
      if (error) throw error;
      toast('Registro actualizado', 'success');
    } else {
      const { error } = await db.from(schema.table).insert([payload]);
      if (error) throw error;
      toast('Registro creado', 'success');
    }
    const table = currentTableKey;
    closeModal();
    await loadAllData();
    renderTable(table);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  } finally {
    modalSave.disabled = false;
    modalSave.innerHTML = '<i class="fas fa-save"></i> Guardar';
  }
};

// =============================================
// ELIMINAR
// =============================================
async function deleteRecord(tableKey, id) {
  const schema = SCHEMA[tableKey];
  if (!confirm(`¿Eliminar registro de ${schema.label}?`)) return;
  try {
    const { error } = await db.from(schema.table).delete().eq(schema.pk, id);
    if (error) throw error;
    toast('Registro eliminado', 'success');
    await loadAllData();
    renderTable(tableKey);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

async function clearUserTransactionHistory(userId) {
  if (!confirm('¿Borrar todas las transacciones de este usuario y conservar su saldo actual?')) return;

  try {
    const balances = await calculateUserBalances();
    const previousBalance = Number(balances[userId] || 0);
    const { error: deleteError } = await db.from(TABLA_TRANSACCIONES).delete().eq('usuario_id', userId);
    if (deleteError) throw deleteError;

    if (previousBalance !== 0) {
      const { error: adjustmentError } = await db.from(TABLA_TRANSACCIONES).insert([{
        usuario_id: userId,
        tipo: previousBalance > 0 ? 'deposito' : 'retiro',
        monto: Math.abs(previousBalance),
        estado: 'completado',
        descripcion: 'Ajuste de balance tras borrar historial',
      }]);
      if (adjustmentError) throw adjustmentError;
    }

    toast('Historial eliminado y saldo conservado', 'success');
    await loadAllData();
    renderTable('users');
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

// =============================================
// TRANSFERIR
// =============================================
function renderTransfer() {
  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas fa-paper-plane"></i> Transferir Fondos</h2>
    </div>
    <div class="transfer-card">
      <div class="panel-header">
        <div class="panel-title"><i class="fas fa-arrow-right-arrow-left"></i> Nueva transferencia</div>
      </div>
      <div class="panel-body">
        <form id="transferForm" class="transfer-form-grid" onsubmit="processTransfer(event)">
          <div class="field field-full">
            <label>Usuario Destino</label>
            <select id="transferUserId" required>
              <option value="">— Seleccionar usuario —</option>
              ${cache.users.map(u => `<option value="${u.id}">${escapeHtml(u.full_name || u.email || u.id.substring(0,8))}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Monto (Bs)</label>
            <input type="number" step="0.01" id="transferAmount" required>
          </div>
          <div class="field">
            <label>Tipo de Transferencia</label>
            <select id="transferType">
              <option value="deposito">Depósito</option>
              <option value="recarga">Recarga</option>
              <option value="transferencia">Transferencia</option>
            </select>
          </div>
          <div class="field field-full">
            <label>Descripción</label>
            <input type="text" id="transferDescription" placeholder="Motivo de la transferencia">
          </div>
          <div class="field field-full" style="display:flex;justify-content:flex-end;align-items:center;">
            <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Realizar Transferencia</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

async function processTransfer(event) {
  event.preventDefault();
  const userId = document.getElementById('transferUserId').value;
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const description = document.getElementById('transferDescription').value;
  const type = document.getElementById('transferType').value;

  if (!userId || !amount || amount <= 0) {
    toast('Complete todos los campos correctamente', 'error');
    return;
  }

  try {
    const { error } = await db.from(TABLA_TRANSACCIONES).insert([{
      usuario_id: userId,
      monto: amount,
      tipo: type,
      estado: 'completado',
      descripcion: description || `Transferencia administrativa de ${formatBs(amount)}`,
      metadata: { admin_transfer: true, timestamp: new Date().toISOString() }
    }]);
    if (error) throw error;

    toast(`Transferencia de ${formatBs(amount)} realizada`, 'success');
    await loadAllData();
    document.getElementById('transferForm').reset();
  } catch (error) {
    toast('Error: ' + error.message, 'error');
  }
}

// =============================================
// INIT
// =============================================
(async function init() {
  try {
    const { error } = await db.from(TABLA_USUARIOS).select('id', { count: 'exact', head: true });
    if (error) throw error;
    await loadAllData();
    renderDashboard();
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:8px;"></i>Error de conexión';
    content.innerHTML = `<div class="empty-state" style="color:#f87171;">
      <i class="fas fa-exclamation-circle" style="font-size:36px;display:block;margin-bottom:12px;"></i>
      Error al conectar con Supabase: ${escapeHtml(err.message)}
    </div>`;
  }
})();
</script>
