<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokTok Admin | Sistema de Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --side: #11151f;
  --panel: #151a26;
  --panel2: #1c2230;
  --head: #121721;
  --border: #232b3d;
  --text: #e8ecf4;
  --muted: #8b95ab;
  --faint: #5c6578;
  --accent: #6366f1;
  --accent2: #4f46e5;
  --accent-glow: rgba(99, 102, 241, 0.3);
  --hover: #1e2638;
  --input: #0f131c;
  --ok: #22c55e;
  --err: #ef4444;
  --warn: #f59e0b;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --font: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --radius: 8px;
  --radius-sm: 6px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme=light] {
  --bg: #f5f7fa; --side: #ffffff; --panel: #ffffff; --panel2: #f8fafc;
  --head: #f1f5f9; --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
  --faint: #94a3b8; --accent: #4f46e5; --accent2: #4338ca;
  --accent-glow: rgba(79, 70, 229, 0.15); --hover: #f1f5f9; --input: #ffffff;
  --ok: #16a34a; --err: #dc2626; --warn: #d97706;
  --shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

.ic { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -.18em; }
.ic.dot { fill: currentColor; stroke: none; }
.ic.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.titlebar { height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; background: var(--side); border-bottom: 1px solid var(--border); user-select: none; }
.tb-l { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); font-weight: 500; }
.tb-l .ic { color: var(--accent); font-size: 16px; }
.tb-l span { color: var(--faint); font-weight: 400; }
.tb-btn { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel2); color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); }
.tb-btn:hover { background: var(--hover); color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.app { flex: 1; min-height: 0; width: 100%; display: flex; overflow: hidden; background: var(--bg); }

.sidebar { width: 250px; background: var(--side); display: flex; flex-direction: column; flex-shrink: 0; transition: width var(--transition); overflow: hidden; border-right: 1px solid var(--border); }
.sidebar.collapsed { width: 64px; }
.sidebar-brand { padding: 20px 20px 16px; display: flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 16px; white-space: nowrap; letter-spacing: -0.3px; }
.sidebar-brand .ic { color: var(--accent); font-size: 26px; min-width: 28px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
.sidebar-brand span.accent { color: var(--accent); }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; overflow-y: auto; overflow-x: hidden; }
.nav-section { padding: 16px 14px 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); font-weight: 700; white-space: nowrap; }
.sidebar.collapsed .nav-section { display: none; }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; transition: var(--transition); border: none; background: transparent; text-align: left; width: 100%; white-space: nowrap; overflow: hidden; }
.nav-item .ic { font-size: 18px; min-width: 20px; color: var(--faint); transition: var(--transition); }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item:hover .ic { color: var(--accent); }
.nav-item.active { background: var(--hover); color: var(--text); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.nav-item.active .ic { color: var(--accent); }
.sidebar.collapsed .nav-item span, .sidebar.collapsed .sidebar-brand span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.sidebar-footer .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0; box-shadow: 0 2px 8px var(--accent-glow); }
.sidebar.collapsed .sidebar-footer span { display: none; }
.sidebar.collapsed .sidebar-footer { justify-content: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; box-shadow: var(--shadow-sm); z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.toggle-btn { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: var(--radius-sm); transition: var(--transition); display: flex; }
.toggle-btn:hover { background: var(--hover); color: var(--accent); }
.topbar h1 { color: var(--text); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 0; letter-spacing: -0.2px; }
.topbar h1 .ic { color: var(--accent); font-size: 20px; }
.topbar-right .badge { background: var(--panel2); color: var(--muted); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); transition: var(--transition); }
.topbar-right .badge:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 24px 28px 40px; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 14px; }
.page-header h2 { color: var(--text); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 12px; min-width: 0; letter-spacing: -0.4px; }
.page-header h2 .ic { color: var(--accent); font-size: 24px; }
.header-actions, .export-actions { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; max-width: 100%; }

.btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: wait; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; box-shadow: 0 2px 12px var(--accent-glow); }
.btn-primary:hover { filter: brightness(1.1); border-color: transparent; box-shadow: 0 4px 20px var(--accent-glow); }
.btn-success { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border-color: transparent; box-shadow: 0 2px 12px rgba(22, 163, 74, 0.3); }
.btn-success:hover { filter: brightness(1.1); border-color: transparent; box-shadow: 0 4px 20px rgba(22, 163, 74, 0.4); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-export { font-weight: 600; font-size: 12px; border-color: transparent; color: #fff; }
.btn-export.excel { background: linear-gradient(135deg, #16a34a, #166534); box-shadow: 0 2px 10px rgba(22, 163, 74, 0.25); }
.btn-export.pdf { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 2px 10px rgba(220, 38, 38, 0.25); }
.btn-export:hover { filter: brightness(1.12); border-color: transparent; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 26px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; transition: var(--transition); box-shadow: var(--shadow-sm); }
.stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 0 12px var(--accent-glow); }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.stat-card .label { color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.stat-card .value { color: var(--text); font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
.stat-card .icon-wrap .ic { font-size: 22px; width: 42px; height: 42px; padding: 10px; border-radius: 10px; background: var(--hover); transition: var(--transition); }
.stat-card:hover .icon-wrap .ic { background: var(--accent); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }

.transfer-card { max-width: 860px; margin: 10px auto 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: var(--transition); }
.transfer-card:hover { border-color: var(--accent); box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4); }
.transfer-card .panel-body { padding: 28px; }
.transfer-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.transfer-form-grid .field-full { grid-column: 1 / -1; }

.panel-header { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--head) !important; }
.panel-title { color: var(--text); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; letter-spacing: -0.2px; }
.panel-title .ic { color: var(--accent); }
.panel-body { padding: 20px 22px; }

.search-input { background: var(--input); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: var(--radius-sm); font-size: 13px; outline: none; min-width: 0; width: min(240px, 100%); transition: var(--transition); }
.search-input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-input::placeholder { color: var(--faint); }

.table-wrap { background: var(--panel); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: var(--transition); }
.table-wrap:hover { box-shadow: var(--shadow); }
.table-scroll { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13.5px; }
th { text-align: left; padding: 14px 18px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; background: var(--head); overflow-wrap: anywhere; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
td { padding: 12px 18px; color: var(--text); overflow-wrap: anywhere; word-break: break-word; vertical-align: middle; border-bottom: 1px solid var(--border); }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel2) 55%, transparent); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--hover) !important; }

.tag { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600; background: var(--panel2); color: var(--muted); letter-spacing: 0.2px; }
.tag.info { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.tag.pending { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.tag.completed { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.failed { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }

.actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
.table-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel2); color: var(--muted); cursor: pointer; transition: var(--transition); }
.table-action-btn:hover { transform: translateY(-2px); color: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
.table-action-btn.edit:hover { color: var(--ok); border-color: var(--ok); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
.table-action-btn.delete:hover { color: var(--err); border-color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
.table-action-btn.pin:hover { color: var(--warn); border-color: var(--warn); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }

.empty-state { padding: 48px 24px; text-align: center; color: var(--faint); font-size: 14px; }
.loading { display: flex; align-items: center; justify-content: center; padding: 64px; color: var(--muted); gap: 14px; font-size: 14px; }
.loading .ic { color: var(--accent); font-size: 22px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(6, 9, 15, 0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 24px; backdrop-filter: blur(8px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 660px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5); animation: pop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--head); }
.modal-header h3 { color: var(--text); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.modal-header h3 .ic { color: var(--accent); }
.modal-close { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 6px 9px; border-radius: var(--radius-sm); transition: var(--transition); display: flex; }
.modal-close:hover { background: var(--err); color: #fff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
.modal-body { padding: 22px; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); background: var(--head); }

.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fields-grid .field-full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.field label { color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: capitalize; letter-spacing: 0.2px; }
.field input, .field select, .field textarea { background: var(--input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text); font-size: 13.5px; outline: none; width: 100%; transition: var(--transition); }
.field textarea { resize: vertical; min-height: 80px; }
.field input[readonly] { opacity: 0.7; cursor: not-allowed; background: var(--panel2); }

/* PIN styles */
.pin-badge { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font-family: 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 4px; font-weight: 700; color: var(--warn); font-size: 14px; min-width: 78px; }
.pin-badge.empty { color: var(--faint); letter-spacing: 0; font-weight: 500; font-family: inherit; font-size: 12px; }
.pin-edit-input { width: 100px; background: var(--input); border: 1px solid var(--warn); border-radius: 8px; padding: 6px 10px; color: var(--text); font-size: 15px; letter-spacing: 4px; text-align: center; font-weight: 700; outline: none; font-family: 'SF Mono', Menlo, Consolas, monospace; }
.pin-edit-input:focus { box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25); }

.toast-container { position: fixed; bottom: 44px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 14px 20px; border-radius: var(--radius-sm); font-size: 13.5px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 300px; backdrop-filter: blur(8px); }
.toast.success { border-left: 3px solid var(--ok); }
.toast.success .ic { color: var(--ok); }
.toast.error { border-left: 3px solid var(--err); }
.toast.error .ic { color: var(--err); }
.toast.info { border-left: 3px solid var(--accent); }
.toast.info .ic { color: var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; border: 2px solid transparent; }
::selection { background: var(--accent); color: #fff; }

@media (max-width: 800px) {
  .sidebar { width: 64px; }
  .sidebar .nav-item span, .sidebar .sidebar-brand span, .sidebar-footer span, .nav-section, .tb-l span { display: none; }
  .sidebar .nav-item { justify-content: center; padding: 10px 0; }
  .sidebar-footer { justify-content: center; }
  .content { padding: 16px; }
  .fields-grid, .transfer-form-grid, .stats-grid { grid-template-columns: 1fr; }
  .page-header h2 { font-size: 19px; }
  .topbar { padding: 10px 16px; }
  .topbar h1 { font-size: 14px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-shield-halved"></i>
      <span>TokTok<span class="accent"> Admin</span></span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" data-view="users" onclick="switchView('users')"><i class="fas fa-users"></i><span>Usuarios</span></button>
      <button class="nav-item" data-view="transactions" onclick="switchView('transactions')"><i class="fas fa-money-bill-wave"></i><span>Transacciones</span></button>
      <button class="nav-item" data-view="transfer" onclick="switchView('transfer')"><i class="fas fa-paper-plane"></i><span>Transferir</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <span>Administrador</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        <h1><i class="fas fa-shield-halved"></i> <span id="pageTitle">Panel de Administración</span></h1>
      </div>
      <div class="topbar-right">
        <span class="badge" id="connStatus"><i class="fas fa-circle" style="color:#22c55e;font-size:8px;"></i>Conectando...</span>
      </div>
    </div>
    <div class="content" id="contentArea">
      <div class="loading"><i class="fas fa-spinner"></i> Cargando...</div>
    </div>
  </main>
</div>

<!-- MODAL CRUD -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-plus"></i> Nuevo registro</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL CAMBIAR PIN -->
<div class="modal-overlay" id="pinModalOverlay">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h3><i class="fas fa-key"></i> Cambiar PIN</h3>
      <button class="modal-close" id="pinModalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:8px;">

function escapeHtml(s) {

// =============================================

async function fetchAllRecords(table, select = '*', filters = []) {
  const pageSize = 1000;
  const records = [];
  for (let offset = 0; ; offset += pageSize) {
    let query = db.from(table).select(select).range(offset, offset + pageSize - 1);
    for (const filter of filters) {
      if (!filter || typeof query[filter.method] !== 'function') continue;
      query = query[filter.method](...(filter.args || []));
    }
    const { data, error } = await query;
    if (error) throw error;
    records.push(...(data || []));
    if (!data || data.length < pageSize) return records;
  }
}

async function calculateUserBalances() {
  try {
    const [users, transactions] = await Promise.all([
      fetchAllRecords(TABLA_USUARIOS, 'id'),
      fetchAllRecords(TABLA_TRANSACCIONES, 'usuario_id, tipo, monto, estado, metadata'),
    ]);
    const balances = Object.fromEntries((users || []).map(user => [user.id, 0]));
    for (const transaction of transactions || []) {
      if (transaction.estado !== 'completado') continue;
      const amount = Number(transaction.monto);
      if (!Number.isFinite(amount)) continue;
      if (transaction.tipo === 'deposito') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] += amount;
      } else if (transaction.tipo === 'retiro' || transaction.tipo === 'recarga') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] -= amount;
      } else if (transaction.tipo === 'transferencia') {
        if (transaction.usuario_id in balances) balances[transaction.usuario_id] -= amount;
        const recipientId = transaction.metadata?.to_user_id || transaction.metadata?.destinatario_id;
        if (recipientId && recipientId in balances) balances[recipientId] += amount;
      }
    }
    return balances;
  } catch (err) { console.error('Error al calcular saldos:', err); return {}; }
}

    cache.users = users || [];

}

function exportTableToExcel(tableKey) {
  const exportData = getExportData(tableKey);
  if (!window.XLSX) return toast('No se pudo cargar el exportador de Excel', 'error');
  const data = [exportData.columns, ...exportData.data];
  const worksheet = XLSX.utils.aoa_to_sheet(data);
  worksheet['!cols'] = exportData.columns.map((column, index) => ({
    wch: Math.min(40, Math.max(column.length + 4, ...exportData.data.slice(0, 100).map(row => String(row[index] ?? '').length + 4))),
  }));
  worksheet['!rows'] = [{ hpt: 30 }];
  const range = XLSX.utils.decode_range(worksheet['!ref']);
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cellAddress = XLSX.utils.encode_cell({ r: 0, c });
    if (!worksheet[cellAddress]) continue;
    worksheet[cellAddress].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 12 },
      fill: { fgColor: { rgb: '4F46E5' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: { top: { style: 'thin', color: { rgb: '6366F1' } }, bottom: { style: 'thin', color: { rgb: '6366F1' } }, left: { style: 'thin', color: { rgb: '6366F1' } }, right: { style: 'thin', color: { rgb: '6366F1' } } },
    };
  }
  for (let r = 1; r <= range.e.r; r++) {
    const fillColor = r % 2 === 0 ? 'EEF2FF' : 'FFFFFF';
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cellAddress = XLSX.utils.encode_cell({ r, c });
      if (!worksheet[cellAddress]) worksheet[cellAddress] = { t: 's', v: '' };
      worksheet[cellAddress].s = {
        fill: { fgColor: { rgb: fillColor } },
        alignment: { vertical: 'center', horizontal: c === 0 ? 'center' : 'left' },
        font: { sz: 11, color: { rgb: '1E293B' } },
        border: { top: { style: 'thin', color: { rgb: 'E2E8F0' } }, bottom: { style: 'thin', color: { rgb: 'E2E8F0' } }, left: { style: 'thin', color: { rgb: 'E2E8F0' } }, right: { style: 'thin', color: { rgb: 'E2E8F0' } } },
      };
    }
  }
  worksheet['!freeze'] = { xSplit: '0', ySplit: '1' };
  worksheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: exportData.data.length, c: exportData.columns.length - 1 } }) };
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, exportData.title.substring(0, 31));
  XLSX.writeFile(workbook, `${exportData.fileName}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  toast(`${exportData.data.length} registros exportados a Excel`, 'success');
}

function exportTableToPdf(tableKey) {
  const exportData = getExportData(tableKey);
  const JsPDF = window.jspdf?.jsPDF;
  if (!JsPDF) return toast('No se pudo cargar el exportador de PDF', 'error');
  const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFillColor(11, 14, 20);
  doc.rect(0, 0, pageWidth, 34, 'F');
  doc.setFillColor(79, 70, 229);
  doc.rect(0, 32, pageWidth, 2, 'F');
  doc.setTextColor(99, 102, 241);
  doc.setFontSize(20);
  doc.setFont('helvetica', 'bold');
  doc.text('TOKTOK ADMIN', 14, 15);
  doc.setTextColor(200, 210, 230);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(exportData.title.toUpperCase(), 14, 23);
  doc.setTextColor(140, 150, 170);
  doc.setFontSize(9);
  doc.text(`${exportData.data.length} registros · ${new Date().toLocaleString('es-BO')}`, pageWidth - 14, 23, { align: 'right' });
  doc.autoTable({
    head: [exportData.columns],
    body: exportData.data,
    startY: 40,
    margin: { left: 12, right: 12, bottom: 20 },
    styles: { fontSize: 8, cellPadding: 4, textColor: [30, 41, 59], lineColor: [226, 232, 240], lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 9, halign: 'center' },
    alternateRowStyles: { fillColor: [238, 242, 255] },
    bodyStyles: { fontSize: 8, cellPadding: 3.5 },
    didDrawPage: function (data) {
      const footerY = pageHeight - 12;
      doc.setFontSize(8);
      doc.setTextColor(140, 150, 170);
      doc.text('TokTok Admin — Gestión de usuarios y transacciones', 12, footerY);
      doc.text(`Página ${data.pageNumber}`, pageWidth - 12, footerY, { align: 'right' });
      doc.setDrawColor(79, 70, 229);
      doc.setLineWidth(0.5);
      doc.line(12, footerY - 4, pageWidth - 12, footerY - 4);
    },
  });
  doc.save(`${exportData.fileName}-${new Date().toISOString().slice(0, 10)}.pdf`);
  toast(`${exportData.data.length} registros exportados a PDF`, 'success');
}

function renderRows(tableKey, rows) {
  const schema = SCHEMA[tableKey];
  if (!rows.length) return `<tr><td colspan="${schema.listFields.length + 1}" class="empty-state">No hay registros</td></tr>`;

          ${tableKey === 'users' ? `<button class="table-action-btn pin" data-pin="${row[schema.pk]}" title="Cambiar PIN"><i class="fas fa-key"></i></button>` : ''}
          ${tableKey === 'users' ? `<button class="table-action-btn" data-clear-history="${row[schema.pk]}" title="Borrar historial y conservar saldo"><i class="fas fa-eraser"></i></button>` : ''}
          <button class="table-action-btn edit" data-edit="${row[schema.pk]}" title="Editar"><i class="fas fa-pen"></i></button>
          <button class="table-action-btn delete" data-del="${row[schema.pk]}" title="Eliminar"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join('');
}

function bindRowActions(tableKey) {
  const schema = SCHEMA[tableKey];

    b.onclick = () => {

  document.querySelectorAll('[data-del]').forEach(b => { b.onclick = () => deleteRecord(tableKey, b.dataset.del); });
  document.querySelectorAll('[data-clear-history]').forEach(b => { b.onclick = () => clearUserTransactionHistory(b.dataset.clearHistory); });
  document.querySelectorAll('[data-pin]').forEach(b => { b.onclick = () => openPinModal(b.dataset.pin); });
}

function renderCell(row, fieldKey, schema) {
  if (fieldKey === 'balance') {
    const value = cache.userBalances[row.id] ?? 0;
    return `<strong style="color:${Number(value) < 0 ? 'var(--err)' : 'var(--ok)'};">${formatBs(value)}</strong>`;
  }
  if (fieldKey === 'pin') {
    const pin = row.pin;
    if (pin) return `<span class="pin-badge">${escapeHtml(pin)}</span>`;
    return `<span class="pin-badge empty">Sin PIN</span>`;
  }
  let value = row[fieldKey];
  if (value === null || value === undefined || value === '') return '—';
  if (fieldKey === 'estado' || fieldKey === 'status') {
    const cls = value === 'completado' ? 'completed' : value === 'fallido' ? 'failed' : 'pending';
    return `<span class="tag ${cls}">${escapeHtml(translateTransactionStatus(value))}</span>`;
  }
  if (fieldKey === 'tipo' || fieldKey === 'type') return `<span class="tag info">${escapeHtml(translateTransactionType(value))}</span>`;
  if (fieldKey === 'monto' || fieldKey === 'amount') return `<strong style="color:var(--text);">${formatBs(value)}</strong>`;
  if (fieldKey === 'creado_en' || fieldKey === 'created_at') return formatDate(value);
  if (fieldKey === 'usuario_id' || fieldKey === 'user_id') {
    if (schema && schema.table === TABLA_TRANSACCIONES) return escapeHtml(getUserNameById(value));
    return `<span style="font-family:monospace;font-size:12px;color:var(--faint);">${escapeHtml(String(value).substring(0, 10))}...</span>`;
  }
  if (fieldKey === 'id') return `<span style="font-family:monospace;font-size:12px;color:var(--faint);">${escapeHtml(String(value).substring(0, 10))}...</span>`;
  return escapeHtml(value);
}

// =============================================
// MODAL CRUD
// =============================================
function openModal(tableKey, row) {
  const schema = SCHEMA[tableKey];
  editingId = row ? row[schema.pk] : null;
  currentTableKey = tableKey;
  modalTitle.innerHTML = row ? `<i class="fas fa-pen"></i> Editar ${schema.singular}` : `<i class="fas fa-plus"></i> Nuevo ${schema.singular}`;
  const fields = schema.columns.filter(c => !['created_at','updated_at','creado_en'].includes(c.key));
  let html = '<div class="fields-grid">';
  fields.forEach(col => {
    const val = row ? row[col.key] : '';
    const full = col.full || col.type === 'textarea' ? ' field-full' : '';
    if (col.type === 'readonly') return;
    if (col.type === 'textarea') {
      html += `<div class="field${full}"><label>${col.label}</label><textarea data-key="${col.key}" ${col.required ? 'required' : ''}>${escapeHtml(val ?? '')}</textarea></div>`;
    } else if (col.type === 'select') {
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}">
          <option value="">— Seleccionar —</option>
          ${col.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${col.key === 'tipo' ? translateTransactionType(o) : col.key === 'estado' ? translateTransactionStatus(o) : o}</option>`).join('')}
        </select></div>`;
    } else {
      const inputType = col.type === 'number' ? 'number' : col.type === 'email' ? 'email' : 'text';
      const step = col.step ? `step="${col.step}"` : '';
      html += `<div class="field${full}"><label>${col.label}</label>
        <input type="${inputType}" data-key="${col.key}" value="${escapeHtml(val ?? '')}" ${step}>
      </div>`;
    }
  });
  html += '</div>';
  modalBody.innerHTML = html;
  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  modalBody.innerHTML = '';
  editingId = null;
  currentTableKey = null;
}

modalClose.onclick = closeModal;
modalCancel.onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

// =============================================
// GUARDAR CRUD
// =============================================
modalSave.onclick = async () => {
  if (!currentTableKey) return;
  const schema = SCHEMA[currentTableKey];
  const payload = {};
  let valid = true;
  modalBody.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const col = schema.columns.find(c => c.key === key);
    if (!col || col.type === 'readonly') return;
    let val;
    if (col.type === 'number') { val = el.value === '' ? null : Number(el.value); if (val !== null && isNaN(val)) val = null; }
    else val = el.value === '' ? null : el.value;
    if (col.required && (val === null || val === '')) { toast(`El campo "${col.label}" es obligatorio`, 'error'); valid = false; }
    payload[key] = val;
  });
  if (!valid) return;
  try {
    modalSave.disabled = true;
    modalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
    if (editingId !== null) {
      const { error } = await db.from(schema.table).update(payload).eq(schema.pk, editingId);
      if (error) throw error;
      toast('Registro actualizado', 'success');
    } else {
      const { error } = await db.from(schema.table).insert([payload]);
      if (error) throw error;
      toast('Registro creado', 'success');
    }
    const table = currentTableKey;
    closeModal();
    await loadAllData();
    renderTable(table);
  } catch (err) { console.error(err); toast(err.message, 'error'); }
  finally { modalSave.disabled = false; modalSave.innerHTML = '<i class="fas fa-save"></i> Guardar'; }
};

// =============================================
// ELIMINAR
// =============================================
async function deleteRecord(tableKey, id) {
  const schema = SCHEMA[tableKey];
  if (!confirm(`¿Eliminar registro de ${schema.label}?`)) return;
  try {
    const { error } = await db.from(schema.table).delete().eq(schema.pk, id);
    if (error) throw error;
    toast('Registro eliminado', 'success');
    await loadAllData();
    renderTable(tableKey);
  } catch (err) { console.error(err); toast(err.message, 'error'); }
}

async function clearUserTransactionHistory(userId) {
  if (!confirm('¿Borrar todas las transacciones de este usuario y conservar su saldo actual?')) return;
  try {
    const balances = await calculateUserBalances();
    const previousBalance = Number(balances[userId] || 0);
    const { error: deleteError } = await db.from(TABLA_TRANSACCIONES).delete().eq('usuario_id', userId);
    if (deleteError) throw deleteError;
    if (previousBalance !== 0) {
      const { error: adjustmentError } = await db.from(TABLA_TRANSACCIONES).insert([{
        usuario_id: userId,
        tipo: previousBalance > 0 ? 'deposito' : 'retiro',
        monto: Math.abs(previousBalance),
        estado: 'completado',
        descripcion: 'Ajuste de balance tras borrar historial',
      }]);
      if (adjustmentError) throw adjustmentError;
    }
    toast('Historial eliminado y saldo conservado', 'success');
    await loadAllData();
    renderTable('users');
  } catch (err) { console.error(err); toast(err.message, 'error'); }
}

// =============================================
// MODAL CAMBIAR PIN
// =============================================
function openPinModal(userId) {
  const user = cache.users.find(u => String(u.id) === String(userId));
  if (!user) { toast('Usuario no encontrado', 'error'); return; }
  pinEditingUserId = userId;
  pinUserName.textContent = user.full_name || user.email || userId;
  pinInput.value = user.pin || '';
  pinModalOverlay.classList.add('show');
  setTimeout(() => { pinInput.focus(); pinInput.select(); }, 100);
}
function closePinModal() {
  pinModalOverlay.classList.remove('show');
  pinEditingUserId = null;
  pinInput.value = '';
}
pinModalClose.onclick = closePinModal;
pinModalCancel.onclick = closePinModal;
pinModalOverlay.onclick = (e) => { if (e.target === pinModalOverlay) closePinModal(); };
pinInput.addEventListener('input', () => { pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4); });
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); pinModalSave.click(); } });

pinModalSave.onclick = async () => {
  if (!pinEditingUserId) return;
  const pin = pinInput.value.trim();
  if (!/^[0-9]{4}$/.test(pin)) { toast('El PIN debe tener exactamente 4 dígitos', 'error'); pinInput.focus(); return; }
  try {
    pinModalSave.disabled = true;
    pinModalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
    const { error } = await db.rpc('admin_set_user_pin', { p_user_id: pinEditingUserId, p_pin: pin });
    if (error) throw error;
    toast('PIN actualizado correctamente', 'success');
    closePinModal();
    await loadAllData();
    if (currentSection === 'users') renderTable('users');
  } catch (err) {
    console.error('Error guardando PIN:', err);
    toast('Error al guardar PIN: ' + err.message, 'error');
  } finally {
    pinModalSave.disabled = false;
    pinModalSave.innerHTML = '<i class="fas fa-check"></i> Guardar PIN';
  }
};

// =============================================
// TRANSFERIR
// =============================================
function renderTransfer() {
  content.innerHTML = `
    <div class="page-header"><h2><i class="fas fa-paper-plane"></i> Transferir Fondos</h2></div>
    <div class="transfer-card">
      <div class="panel-header"><div class="panel-title"><i class="fas fa-arrow-right-arrow-left"></i> Nueva transferencia</div></div>
      <div class="panel-body">
        <form id="transferForm" class="transfer-form-grid" onsubmit="processTransfer(event)">
          <div class="field field-full">
            <label>Usuario Destino</label>
            <select id="transferUserId" required>
              <option value="">— Seleccionar usuario —</option>
              ${cache.users.map(u => `<option value="${u.id}">${escapeHtml(u.full_name || u.email || u.id.substring(0,8))}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Monto (Bs)</label><input type="number" step="0.01" id="transferAmount" required></div>
          <div class="field">
            <label>Tipo de Transferencia</label>
            <select id="transferType">
              <option value="deposito">Depósito</option>
              <option value="recarga">Recarga</option>
              <option value="transferencia">Transferencia</option>
            </select>
          </div>
          <div class="field field-full"><label>Descripción</label><input type="text" id="transferDescription" placeholder="Motivo de la transferencia"></div>
          <div class="field field-full" style="display:flex;justify-content:flex-end;align-items:center;">
            <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Realizar Transferencia</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

async function processTransfer(event) {
  event.preventDefault();
  const userId = document.getElementById('transferUserId').value;
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const description = document.getElementById('transferDescription').value;
  const type = document.getElementById('transferType').value;
  if (!userId || !amount || amount <= 0) { toast('Complete todos los campos correctamente', 'error'); return; }
  try {
    const { error } = await db.from(TABLA_TRANSACCIONES).insert([{
      usuario_id: userId, monto: amount, tipo: type, estado: 'completado',
      descripcion: description || `Transferencia administrativa de ${formatBs(amount)}`,
      metadata: { admin_transfer: true, timestamp: new Date().toISOString() }
    }]);
    if (error) throw error;
    toast(`Transferencia de ${formatBs(amount)} realizada`, 'success');
    await loadAllData();
    document.getElementById('transferForm').reset();
  } catch (error) { toast('Error: ' + error.message, 'error'); }
}

// =============================================
// INIT
// =============================================
(async function init() {
  try {
    const { error } = await db.from(TABLA_USUARIOS).select('id', { count: 'exact', head: true });
    if (error) throw error;
    await loadAllData();
    renderDashboard();
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i>Error de conexión';
    content.innerHTML = `<div class="empty-state" style="color:var(--err);">
      <i class="fas fa-exclamation-circle" style="font-size:36px;display:block;margin-bottom:12px;"></i>
      Error al conectar con Supabase: ${escapeHtml(err.message)}
    </div>`;
  }
})();
</script>

<script>
(function(){
const P={
'shield-halved':'M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z M12 2v20',
'chart-pie':'M21 12A9 9 0 1 1 12 3v9z M15 3.5A9 9 0 0 1 20.5 9H15z',

'money-bill-wave':'M2 6h20v12H2z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M6 12h.01 M18 12h.01',
'paper-plane':'M22 2L11 13 M22 2l-7 20-4-9-9-4z',
'bars':'M3 6h18 M3 12h18 M3 18h18',

'pen':'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
'trash':'M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6 M10 11v6 M14 11v6',
'eraser':'M20 20H9l-5-5a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3L13 20 M7 11l6 6',
'file-excel':'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13l6 6 M15 13l-6 6',
'file-pdf':'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h5',
'arrow-right-arrow-left':'M17 3l4 4-4 4 M21 7H8 M7 21l-4-4 4-4 M3 17h13',
'exclamation-circle':'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 8v4 M12 16h.01',
'check-circle':'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M8 12l3 3 5-6',
'info-circle':'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 16v-4 M12 8h.01',
'user':'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
'clock':'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 6v6l4 2',
'sun':'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4',
'moon':'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
'key':'M15.5 14a5 5 0 1 0-4.5 4.9V21l2 2 2-2 2 2 2-2-2-2 1.5-1.5z M15.5 8h.01',
'check':'M20 6L9 17l-5-5'};
function swap(el){
  const m=[...el.classList].find(c=>c.startsWith('fa-')&&P[c.slice(3)]);
  if(!m)return;
  const n=m.slice(3),s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('class','ic'+(n==='circle'?' dot':'')+((n==='spinner'||el.classList.contains('fa-spin'))?' spin':''));
  const st=el.getAttribute('style');if(st)s.setAttribute('style',st);
  s.innerHTML='<path d="'+P[n]+'"/>';
  el.replaceWith(s);
}
function scan(r){
  if(r.nodeType!==1)return;
  if(r.tagName==='I')swap(r);
  else r.querySelectorAll('i[class*="fa-"]').forEach(swap);
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(scan))).observe(document.body,{childList:true,subtree:true});

const tb=document.createElement('div');tb.className='titlebar';
tb.innerHTML='<div class="tb-l"><i class="fa-shield-halved"></i><b>TokTok Admin</b><span>Sistema de Gestión</span></div><button class="tb-btn" id="themeBtn" title="Cambiar tema claro / oscuro"></button>';
document.body.prepend(tb);
scan(document.body);

const btn=document.getElementById('themeBtn');
function apply(t){
  document.documentElement.dataset.theme=t;
  btn.innerHTML='<i class="fa-'+(t==='dark'?'sun':'moon')+'"></i>'+(t==='dark'?'Modo claro':'Modo oscuro');
  try{localStorage.setItem('toktok-theme',t)}catch(e){}
}
let saved='dark';try{saved=localStorage.getItem('toktok-theme')||'dark'}catch(e){}
apply(saved);
btn.onclick=()=>apply(document.documentElement.dataset.theme==='dark'?'light':'dark');
})();
</script>
