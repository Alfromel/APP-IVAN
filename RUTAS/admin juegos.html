<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKTOK Admin | Panel Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; }
  .app { width: 100vw; height: 100vh; display: flex; overflow: hidden; background: #000; }
  .sidebar { width: 260px; background: #080808; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s; overflow: hidden; }
  .sidebar.collapsed { width: 72px; }
  .sidebar-brand { padding: 20px 22px; display: flex; align-items: center; gap: 12px; color: #f0f0f5; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .sidebar-brand i { color: #10b981; font-size: 26px; min-width: 28px; text-align: center; }
  .sidebar-brand span.accent { color: #10b981; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; color: #9a9ab0; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; background: transparent; text-align: left; width: 100%; white-space: nowrap; }
  .nav-item i { font-size: 17px; min-width: 22px; text-align: center; color: #6a6a85; }
  .nav-item:hover { background: #181818; color: #d0d0e0; }
  .nav-item.active { background: #202020; color: #fff; }
  .nav-item.active i { color: #10b981; }
  .sidebar.collapsed .nav-item span, .sidebar.collapsed .sidebar-brand span { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
  .sidebar-footer { padding: 16px 18px; border-top: 1px solid #242424; display: flex; align-items: center; gap: 12px; color: #6a6a85; font-size: 13px; white-space: nowrap; }
  .sidebar-footer .avatar { width: 34px; height: 34px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; color: #10b981; font-weight: 700; }
  .sidebar.collapsed .sidebar-footer span { display: none; }
  .sidebar.collapsed .sidebar-footer { justify-content: center; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #080808; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .toggle-btn { background: transparent; border: none; color: #8a8aa0; font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .toggle-btn:hover { background: #181818; color: #fff; }
  .topbar h1 { color: #e8e8f0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .topbar h1 i { color: #10b981; font-size: 20px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-right .badge { background: #181818; color: #8a8aa0; padding: 6px 14px; border-radius: 20px; font-size: 12px; }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-header h2 { color: #f0f0f5; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .page-header h2 i { color: #10b981; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { background: #181818; border: none; color: #d0d0e0; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: #2a2a2a; color: #fff; }
  .btn-primary { background: #10b981; color: #0a0a0a; }
  .btn-primary:hover { background: #059669; }
  .btn-danger { background: #c2410c; color: #000; }
  .btn-danger:hover { background: #9a3412; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: #101010; border-radius: 14px; padding: 18px 20px; }
  .stat-card .label { color: #8a8aa0; font-size: 12px; text-transform: uppercase; }
  .stat-card .value { color: #fff; font-size: 28px; font-weight: 700; }
  .stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
  .stat-card .icon-wrap i { font-size: 22px; opacity: 0.7; }
  .table-wrap { background: #101010; border-radius: 14px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 700px; }
  th { text-align: left; padding: 13px 18px; color: #8a8aa0; font-weight: 600; font-size: 11.5px; text-transform: uppercase; background: #0a0a0a; }
  td { padding: 12px 18px; color: #c0c0d0; vertical-align: middle; }
  tr:hover td { background: #16162a; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; background: #202020; color: #b0b0c8; }
  .tag.activo { background: #14331f; color: #4ade80; }
  .tag.inactivo { background: #3a240f; color: #10b981; }
  .tag.sku { background: #1a2a3a; color: #60a5fa; font-family: 'Courier New', monospace; }
  .tag.tipo-blanca { background: #14331f; color: #4ade80; }
  .tag.tipo-negra { background: #3a0f0f; color: #ef4444; }
  .tag.tipo-esekaus { background: #2a1a3a; color: #a78bfa; }
  .tag.tipo-api { background: #1a2a3a; color: #60a5fa; }
  .tag.tipo-bot { background: #3a2a0a; color: #fbbf24; }
  .tag.estado-completado { background: #14331f; color: #4ade80; }
  .tag.estado-rechazado { background: #3a0f0f; color: #ef4444; }
  .tag.orden { background: #2a2a3a; color: #fbbf24; font-family: 'Courier New', monospace; }
  .actions-cell { display: flex; gap: 6px; }
  .empty-state { padding: 40px 20px; text-align: center; color: #6a6a85; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #8a8aa0; gap: 12px; }
  .loading i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(6px); }
  .modal-overlay.show { display: flex; }
  .modal { background: #101010; border-radius: 16px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal.modal-wide { max-width: 900px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #242424; }
  .modal-header h3 { color: #f0f0f5; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .modal-header h3 i { color: #10b981; }
  .modal-close { background: transparent; border: none; color: #8a8aa0; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .modal-close:hover { background: #181818; color: #fff; }
  .modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fields-grid .field-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: #9a9ab0; font-size: 12.5px; }
  .field input, .field select, .field textarea { background: #080808; border: 1px solid #282828; border-radius: 10px; padding: 10px 14px; color: #e0e0f0; font-size: 13.5px; outline: none; font-family: inherit; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #10b981; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-checkbox { flex-direction: row; align-items: center; gap: 10px; }
  .field-checkbox input { width: auto; accent-color: #10b981; }
  .field-hint { font-size: 11px; color: #6a6a85; }
  .field-warn { font-size: 11px; color: #fbbf24; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #242424; }
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: #181818; color: #e0e0f0; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; min-width: 260px; animation: slideIn 0.25s; }
  .toast.success { border-left: 3px solid #4ade80; }
  .toast.error { border-left: 3px solid #10b981; }
  .toast.info { border-left: 3px solid #60a5fa; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
  @media (max-width: 800px) {
    .sidebar { width: 72px; }
    .sidebar .nav-item span, .sidebar .sidebar-brand span, .sidebar-footer span { display: none; }
    .sidebar .nav-item { justify-content: center; padding: 11px 0; }
    .sidebar-footer { justify-content: center; }
    .content { padding: 16px; }
    .fields-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fas fa-gamepad"></i><span>TOK<span class="accent">TOK</span></span></div>

      <button class="nav-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        <h1><i class="fas fa-shield-halved"></i> <span id="pageTitle">Panel de Administración</span></h1>
      </div>
      <div class="topbar-right">
        <span class="badge" id="connStatus"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;margin-right:6px;"></i>Conectado</span>
      </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-plus"></i> Nuevo registro</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>

const SCHEMA = {

      { key: 'stock', label: 'Stock', type: 'number' },
      { key: 'imagen_url', label: 'URL de Imagen', type: 'text', full: true },
      { key: 'sku_razer', label: 'SKU Razer (solo tipo API)', type: 'text', placeholder: 'Ej: 23802', hint: 'Obligatorio solo para paquetes de tipo API' },
      { key: 'tipo', label: 'Tipo (vacío = hereda de categoría)', type: 'select', options: ['', 'api', 'bot'] },

    columns: [

      { key: 'paquete_id', label: 'Paquete', type: 'select-fk', fk: 'packages' },
      { key: 'campo_key', label: 'Key (ej: player_id)', type: 'text', required: true },
      { key: 'campo_label', label: 'Etiqueta visible', type: 'text', required: true },
      { key: 'campo_tipo', label: 'Tipo de campo', type: 'select', options: ['text','number','email','select'], required: true },
      { key: 'placeholder', label: 'Placeholder', type: 'text' },

  },
  ips_control: {

      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'ip', label: 'IP', type: 'text', required: true },
      { key: 'tipo', label: 'Tipo', type: 'select', options: ['blanca','negra','esekaus'], required: true },
      { key: 'motivo', label: 'Motivo', type: 'text' },
      { key: 'nota', label: 'Nota', type: 'textarea', full: true },

      { key: 'user_id', label: 'User ID', type: 'text', required: true },
      { key: 'ip', label: 'IP', type: 'text' },
      { key: 'user_agent', label: 'User Agent', type: 'text', full: true },
      { key: 'es_sospechosa', label: 'Sospechosa', type: 'boolean' },
      { key: 'veces_usada', label: 'Veces Usada', type: 'number' },
    ],
    listFields: ['id','user_id','ip','es_sospechosa','veces_usada','ultima_vez'],

      { key: 'id', label: 'ID', type: 'readonly' },

      { key: 'razer_reference_id', label: 'Ref Razer', type: 'text' },

      { key: 'estado', label: 'Estado', type: 'text' },

      { key: 'modo_ip', label: 'Modo IP', type: 'select', options: ['blacklist','whitelist','off'] },

};

let currentData = [];
let editingId = null;
let currentTableKey = null;
let categoriesCache = [];
let packagesCache = [];

const $ = s => document.querySelector(s);
const content = $('#content');
const modalOverlay = $('#modalOverlay');
const modalTitle = $('#modalTitle');
const modalBody = $('#modalBody');
const modalSave = $('#modalSave');
const modalClose = $('#modalClose');
const modalCancel = $('#modalCancel');

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
  $('#toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getCategoryName(id) {
  const c = categoriesCache.find(x => x.id === id);
  return c ? c.nombre : '—';
}
function getPackageName(id) {
  const p = packagesCache.find(x => x.id === id);
  return p ? p.nombre : '—';
}
function getCategoryTipo(id) {
  const c = categoriesCache.find(x => x.id === id);
  return c ? c.tipo : 'api';
}
function tipoEfectivoPaquete(row) {
  if (row.tipo) return row.tipo;
  return getCategoryTipo(row.categoria_id) || 'api';
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderSection(btn.dataset.section);
  });
});
$('#toggleSidebar').addEventListener('click', () => $('#sidebar').classList.toggle('collapsed'));

async function renderSection(section) {
  content.innerHTML = `<div class="loading"><i class="fas fa-spinner"></i> Cargando...</div>`;
  try {
    if (section === 'dashboard') return await renderDashboard();
    if (SCHEMA[section]) return await renderTable(section);
    content.innerHTML = `<div class="empty-state">Sección no encontrada</div>`;
  } catch (err) {
    console.error(err);
    content.innerHTML = `<div class="empty-state" style="color:#10b981;">Error: ${escapeHtml(err.message)}</div>`;
  }
}

async function loadCategoriesCache() {
  const { data, error } = await db.from('categorias_juegos').select('*').order('nombre');
  if (error) throw error;
  categoriesCache = data || [];
  return categoriesCache;
}
async function loadPackagesCache() {
  const { data, error } = await db.from('paquetes_juegos').select('id,nombre,categoria_id,tipo').order('nombre');
  if (error) throw error;
  packagesCache = data || [];
  return packagesCache;
}

async function renderDashboard() {
  await Promise.all([loadCategoriesCache(), loadPackagesCache()]);
  const [cats, packs, ipsC, ipsU, tokens, logs, reqs] = await Promise.all([
    db.from('categorias_juegos').select('*', { count: 'exact', head: true }),
    db.from('paquetes_juegos').select('*', { count: 'exact', head: true }),
    db.from('ips_control').select('*', { count: 'exact', head: true }),
    db.from('ips_usuarios').select('*', { count: 'exact', head: true }),
    db.from('compras_tokens').select('*', { count: 'exact', head: true }),
    db.from('log_recargas_juegos').select('*', { count: 'exact', head: true }),
    db.from('requisitos_juego').select('*', { count: 'exact', head: true }),
  ]);

  const cards = [
    { label: 'Categorías', value: cats.count || 0, icon: 'fa-gamepad', color: '#10b981' },
    { label: 'Paquetes', value: packs.count || 0, icon: 'fa-box', color: '#fbbf24' },
    { label: 'Requisitos', value: reqs.count || 0, icon: 'fa-list-check', color: '#34d399' },
    { label: 'IPs Control', value: ipsC.count || 0, icon: 'fa-shield-alt', color: '#60a5fa' },
    { label: 'IPs Usuarios', value: ipsU.count || 0, icon: 'fa-map-marker-alt', color: '#a78bfa' },
    { label: 'Tokens', value: tokens.count || 0, icon: 'fa-key', color: '#f472b6' },
    { label: 'Log Recargas', value: logs.count || 0, icon: 'fa-history', color: '#4ade80' },
  ];

  content.innerHTML = `
    <div class="page-header"><h2><i class="fas fa-chart-pie"></i> Dashboard</h2></div>
    <div class="stats-grid">
      ${cards.map(c => `
        <div class="stat-card">
          <div class="icon-wrap"><span class="label">${c.label}</span><i class="fas ${c.icon}" style="color:${c.color}"></i></div>
          <span class="value">${c.value}</span>
        </div>
      `).join('')}
    </div>
  `;
}

async function renderTable(tableKey) {
  currentTableKey = tableKey;
  const schema = SCHEMA[tableKey];
  await loadCategoriesCache();
  if (tableKey === 'packages' || tableKey === 'requisitos') await loadPackagesCache();

  let query = db.from(schema.table).select(schema.joinSelect || '*');
  if (schema.table === 'configuracion_seguridad') {
    // sin orden
  } else if (schema.table === 'ips_usuarios') {
    query = query.order('ultima_vez', { ascending: false }).limit(200);
  } else if (schema.table === 'packages') {
    query = query.order('orden', { ascending: true }).limit(200);
  } else if (schema.table === 'requisitos_juego') {
    query = query.order('orden', { ascending: true }).limit(200);
  } else {
    query = query.order('creado_en', { ascending: false }).limit(200);
  }

  const { data, error } = await query;
  if (error) throw error;
  currentData = data || [];

  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas ${schema.icon}"></i> ${schema.label}</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="btnNew"><i class="fas fa-plus"></i> Nuevo</button>
        <button class="btn" id="btnRefresh"><i class="fas fa-sync"></i> Refrescar</button>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              ${schema.listFields.map(f => `<th>${schema.columns.find(c => c.key === f)?.label || f}</th>`).join('')}
              <th style="text-align:right;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${currentData.length ? currentData.map(row => `
              <tr>
                ${schema.listFields.map(f => `<td>${renderCell(row, f, schema)}</td>`).join('')}
                <td>
                  <div class="actions-cell" style="justify-content:flex-end;">
                    <button class="btn btn-sm" data-edit="${row[schema.pk]}" title="Editar"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm btn-danger" data-del="${row[schema.pk]}" title="Eliminar"><i class="fas fa-trash"></i></button>
                  </div>
                </td>
              </tr>
            `).join('') : `<tr><td colspan="${schema.listFields.length + 1}" class="empty-state">No hay registros</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#btnNew').onclick = () => openModal(tableKey, null);
  $('#btnRefresh').onclick = () => renderSection(tableKey);

  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      const row = currentData.find(r => String(r[schema.pk]) === b.dataset.edit);
      openModal(tableKey, row);
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => deleteRecord(tableKey, b.dataset.del);
  });
}

function renderCell(row, fieldKey, schema) {
  const col = schema.columns.find(c => c.key === fieldKey);
  let value = row[fieldKey];

  if (fieldKey === 'categoria_id') return escapeHtml(getCategoryName(value));
  if (fieldKey === 'paquete_id') return escapeHtml(getPackageName(value));
  if (fieldKey === 'tipo' && schema.table === 'paquetes_juegos') {
    const t = tipoEfectivoPaquete(row);
    const heredado = !row.tipo ? ' (heredado)' : '';
    const cls = t === 'bot' ? 'tipo-bot' : 'tipo-api';
    return `<span class="tag ${cls}">${escapeHtml(t)}</span><span style="font-size:10px;color:#6a6a85">${heredado}</span>`;
  }
  if (value === null || value === undefined || value === '') {
    if (fieldKey === 'sku_razer') return '<span style="color:#6a6a85">—</span>';
    return '—';
  }
  if (col?.type === 'boolean') return value ? '<span class="tag activo">Sí</span>' : '<span class="tag inactivo">No</span>';
  if (fieldKey === 'orden') return `<span class="tag orden">${escapeHtml(value)}</span>`;
  if (fieldKey === 'porcentaje_descuento') {
    const d = Number(value) || 0;
    return d > 0 ? `<span class="tag activo">-${d}%</span>` : '<span class="tag">Sin dcto</span>';
  }
  if (fieldKey === 'destacado') return value ? '<span class="tag activo">⭐</span>' : '<span class="tag">—</span>';
  if (fieldKey === 'activo') return value ? '<span class="tag activo">Activo</span>' : '<span class="tag inactivo">Inactivo</span>';
  if (fieldKey === 'tipo') {
    const cls = value === 'bot' ? 'tipo-bot' : 'tipo-api';
    return `<span class="tag ${cls}">${escapeHtml(value)}</span>`;
  }
  if (fieldKey === 'campo_tipo') return `<span class="tag">${escapeHtml(value)}</span>`;
  if (fieldKey === 'campo_key') return `<span class="tag sku">${escapeHtml(value)}</span>`;
  if (fieldKey === 'color') return `<span style="display:inline-block;width:22px;height:22px;background:${escapeHtml(value)};border-radius:6px;vertical-align:middle;"></span>`;
  if (fieldKey === 'icono') return `<i class="fas ${escapeHtml(value)}" style="color:#10b981;"></i> ${escapeHtml(value)}`;
  if (['precio_referencia','precio_final','precio_cobrado','saldo_antes','saldo_despues'].includes(fieldKey)) return `Bs ${escapeHtml(value)}`;
  if (fieldKey === 'sku_razer') return `<span class="tag sku">${escapeHtml(value)}</span>`;
  if (['creado_en','ultima_vez','expira_en'].includes(fieldKey)) {
    try { return new Date(value).toLocaleString('es-BO'); } catch { return escapeHtml(value); }
  }
  if (['razer_reference_id','token'].includes(fieldKey)) return `<span style="font-family:monospace;font-size:11px;color:#60a5fa">${escapeHtml(String(value).substring(0, 20))}...</span>`;
  return escapeHtml(value);
}

function openModal(tableKey, row) {
  const schema = SCHEMA[tableKey];
  editingId = row ? row[schema.pk] : null;
  currentTableKey = tableKey;
  modalTitle.innerHTML = row ? `<i class="fas fa-pen"></i> Editar ${schema.singular}` : `<i class="fas fa-plus"></i> Nuevo ${schema.singular}`;

  const fields = schema.columns.filter(c => !['creado_en','actualizado_en'].includes(c.key));
  let html = '<div class="fields-grid">';

  fields.forEach(col => {
    if (col.type === 'readonly') return;
    const val = row ? row[col.key] : '';
    const full = col.full || col.type === 'textarea' ? ' field-full' : '';

    if (col.type === 'textarea') {
      html += `<div class="field${full}"><label>${col.label}</label><textarea data-key="${col.key}" ${col.required?'required':''}>${escapeHtml(val ?? '')}</textarea></div>`;
    } else if (col.type === 'select') {
      html += `<div class="field${full}"><label>${col.label}</label><select data-key="${col.key}" ${col.required?'required':''}>
        ${col.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o || '— heredar —'}</option>`).join('')}
      </select>${col.hint?`<span class="field-hint">${col.hint}</span>`:''}</div>`;
    } else if (col.type === 'select-fk') {
      const cache = col.fk === 'categories' ? categoriesCache : col.fk === 'packages' ? packagesCache : [];
      html += `<div class="field${full}"><label>${col.label}</label><select data-key="${col.key}" ${col.required?'required':''}>
        <option value="">— Seleccionar —</option>
        ${cache.map(o => `<option value="${o.id}" ${val===o.id?'selected':''}>${escapeHtml(o.nombre)}</option>`).join('')}
      </select></div>`;
    } else if (col.type === 'boolean') {
      html += `<div class="field field-checkbox${full}"><input type="checkbox" data-key="${col.key}" id="chk_${col.key}" ${val?'checked':''}><label for="chk_${col.key}">${col.label}</label></div>`;
    } else {
      const inputType = col.type === 'number' ? 'number' : col.type === 'color' ? 'color' : 'text';
      const step = col.step ? `step="${col.step}"` : '';
      const ph = col.placeholder ? `placeholder="${col.placeholder}"` : '';
      html += `<div class="field${full}"><label>${col.label}</label>
        <input type="${inputType}" data-key="${col.key}" value="${escapeHtml(val ?? '')}" ${col.required?'required':''} ${step} ${ph}>
        ${col.hint?`<span class="field-hint">${col.hint}</span>`:''}
      </div>`;
    }
  });

  if (tableKey === 'requisitos') {
    const destino = row?.paquete_id ? 'paquete' : row?.categoria_id ? 'categoria' : 'categoria';
    html += `<div class="field field-full"><label>Aplica a</label><select id="req_destino">
      <option value="categoria" ${destino==='categoria'?'selected':''}>Categoría completa</option>
      <option value="paquete" ${destino==='paquete'?'selected':''}>Paquete específico</option>
    </select></div>`;
  }

  html += '</div>';
  modalBody.innerHTML = html;

  if (tableKey === 'requisitos') {
    const sel = modalBody.querySelector('#req_destino');
    const catSel = modalBody.querySelector('[data-key="categoria_id"]');
    const pkgSel = modalBody.querySelector('[data-key="paquete_id"]');
    const toggle = () => {
      if (sel.value === 'categoria') {
        catSel.closest('.field').style.display = 'flex';
        pkgSel.closest('.field').style.display = 'none';
        pkgSel.value = '';
      } else {
        catSel.closest('.field').style.display = 'none';
        pkgSel.closest('.field').style.display = 'flex';
        catSel.value = '';
      }
    };
    sel.onchange = toggle;
    toggle();
  }

  if (tableKey === 'packages') {
    // Lógica dinámica: el SKU solo se exige si el paquete es tipo API
    const catSel = modalBody.querySelector('[data-key="categoria_id"]');
    const tipoSel = modalBody.querySelector('[data-key="tipo"]');
    const skuInput = modalBody.querySelector('[data-key="sku_razer"]');
    const skuField = skuInput.closest('.field');
    const skuLabel = skuField.querySelector('label');
    const hintEl = skuField.querySelector('.field-hint');

    const actualizarSku = () => {
      const catId = catSel.value;
      const tipoPkg = tipoSel.value;
      const tipoCat = catId ? getCategoryTipo(catId) : 'api';
      const tipoFinal = tipoPkg || tipoCat || 'api';

      if (tipoFinal === 'bot') {
        skuInput.required = false;
        skuInput.placeholder = 'No requerido para tipo BOT';
        skuInput.style.opacity = '0.5';
        skuLabel.textContent = 'SKU Razer (NO requerido - tipo BOT)';
        if (hintEl) hintEl.innerHTML = '<span class="field-warn">⚠ Este paquete es tipo BOT. El SKU Razer no es necesario, se guardará vacío.</span>';
      } else {
        skuInput.required = true;
        skuInput.placeholder = 'Ej: 23802';
        skuInput.style.opacity = '1';
        skuLabel.textContent = 'SKU Razer (requerido - tipo API)';
        if (hintEl) hintEl.innerHTML = 'Obligatorio para paquetes de tipo API';
      }
    };

    catSel.onchange = actualizarSku;
    tipoSel.onchange = actualizarSku;
    actualizarSku();
  }

  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  modalBody.innerHTML = '';
  editingId = null;
  currentTableKey = null;
}
modalClose.onclick = closeModal;
modalCancel.onclick = closeModal;
modalOverlay.onclick = e => { if (e.target === modalOverlay) closeModal(); };

modalSave.onclick = async () => {
  if (!currentTableKey) return;
  const schema = SCHEMA[currentTableKey];
  const payload = {};
  let valid = true;

  modalBody.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const col = schema.columns.find(c => c.key === key);
    if (!col || col.type === 'readonly') return;
    let val;
    if (col.type === 'boolean') val = el.checked;
    else if (col.type === 'number') {
      val = el.value === '' ? null : Number(el.value);
      if (val !== null && isNaN(val)) val = null;
    } else val = el.value === '' ? null : el.value;

    if (col.required && (val === null || val === '') && currentTableKey !== 'requisitos') {
      toast(`El campo "${col.label}" es obligatorio`, 'error');
      valid = false;
    }
    payload[key] = val;
  });

  if (!valid) return;

  if (currentTableKey === 'packages') {
    const ref = Number(payload.precio_referencia) || 0;
    const fin = Number(payload.precio_final) || 0;
    if (ref > 0 && fin > 0 && ref < fin) {
      toast('El precio final no puede ser mayor al de referencia', 'error');
      return;
    }
    if (!payload.porcentaje_descuento) payload.porcentaje_descuento = 0;
    if (!payload.orden) payload.orden = 0;
    if (payload.tipo === '') payload.tipo = null;

    // Tipo efectivo del paquete
    const tipoCat = getCategoryTipo(payload.categoria_id);
    const tipoFinal = payload.tipo || tipoCat || 'api';

    if (tipoFinal === 'bot') {
      // Tipo BOT: SKU no requerido, se guarda NULL
      payload.sku_razer = null;
    } else {
      // Tipo API: SKU obligatorio
      if (!payload.sku_razer || String(payload.sku_razer).trim() === '') {
        toast('El SKU Razer es obligatorio para paquetes de tipo API', 'error');
        return;
      }
    }
  }

  if (currentTableKey === 'requisitos') {
    const destino = modalBody.querySelector('#req_destino')?.value || 'categoria';
    if (destino === 'categoria') {
      payload.paquete_id = null;
      if (!payload.categoria_id) { toast('Selecciona una categoría', 'error'); return; }
    } else {
      payload.categoria_id = null;
      if (!payload.paquete_id) { toast('Selecciona un paquete', 'error'); return; }
    }
    if (!payload.campo_key || !payload.campo_label) { toast('Campo key y label obligatorios', 'error'); return; }
    if (payload.opciones && typeof payload.opciones === 'string') {
      try { payload.opciones = JSON.parse(payload.opciones); } catch { payload.opciones = null; }
    }
  }

  try {
    modalSave.disabled = true;
    modalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
    if (editingId !== null) {
      const { error } = await db.from(schema.table).update(payload).eq(schema.pk, editingId);
      if (error) throw error;
      toast('Actualizado', 'success');
    } else {
      const { error } = await db.from(schema.table).insert([payload]);
      if (error) throw error;
      toast('Creado', 'success');
    }
    const table = currentTableKey;
    closeModal();
    await renderSection(table);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  } finally {
    modalSave.disabled = false;
    modalSave.innerHTML = '<i class="fas fa-save"></i> Guardar';
  }
};

async function deleteRecord(tableKey, id) {
  const schema = SCHEMA[tableKey];
  if (!confirm(`¿Eliminar registro de ${schema.label}?`)) return;
  try {
    const { error } = await db.from(schema.table).delete().eq(schema.pk, id);
    if (error) throw error;
    toast('Eliminado', 'success');
    await renderSection(tableKey);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

(async function init() {
  try {
    const { error } = await db.from('categorias_juegos').select('id', { count: 'exact', head: true });
    if (error) throw error;
    await renderDashboard();
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:8px;margin-right:6px;"></i>Error';
    content.innerHTML = `<div class="empty-state" style="color:#ef4444;">Error: ${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
