<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Tarjetas - TokTok</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;margin:0;}
.container{max-width:1100px;margin:0 auto;padding:20px;}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:24px;}
.title{font-size:22px;font-weight:700;background:linear-gradient(90deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.tab{padding:10px 18px;border-radius:10px;background:#1c1c1c;color:#aaa;border:1px solid rgba(255,255,255,.08);cursor:pointer;font-weight:600;font-size:14px;}
.tab.active{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-color:transparent;}
.card{background:#141414;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:20px;}
.label{display:block;font-size:12px;font-weight:600;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.input,.select,.textarea{width:100%;padding:12px 14px;background:#1c1c1c;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:#8b5cf6;}
.textarea{min-height:90px;resize:vertical;}
.btn{padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;}
.btn-danger{background:#dc2626;color:#fff;}
.btn-success{background:#059669;color:#fff;}
.btn-ghost{background:#1c1c1c;color:#fff;border:1px solid rgba(255,255,255,.1);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.prod-card{background:#1c1c1c;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;}
.prod-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0a0a0a;}
.prod-body{padding:12px;}
.prod-name{font-weight:700;font-size:14px;margin-bottom:4px;}
.prod-price{color:#a855f7;font-weight:800;font-size:16px;margin-bottom:8px;}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;}
.badge-disponible{background:rgba(5,150,105,.15);color:#10b981;}
.badge-comprado{background:rgba(220,38,38,.15);color:#ef4444;}
.cat-item{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#1c1c1c;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:10px;}
.toast{position:fixed;top:20px;right:20px;padding:12px 18px;border-radius:12px;background:#059669;color:#fff;font-weight:600;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.error{background:#dc2626;}
.flex-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.flex-row .form-group{flex:1;min-width:180px;}
.form-group{margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.grid-2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title"><i class="fas fa-shield-alt mr-2"></i>Admin Tarjetas</div>
    <a href="tarjetas.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i>Ver tienda</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="productos"><i class="fas fa-box"></i> Productos</button>
    <button class="tab" data-tab="categorias"><i class="fas fa-tags"></i> Categorías</button>
  </div>

  <!-- CATEGORÍAS -->
  <div id="tab-categorias" style="display:none;">
    <div class="card">
      <h3 style="font-size:16px;font-weight:700;margin:0 0 16px;"><i class="fas fa-plus-circle mr-2 text-purple-400"></i>Nueva categoría</h3>
      <div class="grid-2">
        <div class="form-group">
          <label class="label">Nombre</label>
          <input id="catNombre" class="input" placeholder="Ej: Streaming">
        </div>
        <div class="form-group">
          <label class="label">Descripción</label>
          <input id="catDesc" class="input" placeholder="Opcional">
        </div>
      </div>
      <button class="btn btn-primary" id="addCatBtn"><i class="fas fa-save"></i>Guardar categoría</button>
    </div>

    <div class="card">
      <h3 style="font-size:16px;font-weight:700;margin:0 0 16px;"><i class="fas fa-list mr-2 text-purple-400"></i>Categorías existentes</h3>
      <div id="catList"></div>
    </div>
  </div>

  <!-- PRODUCTOS -->
  <div id="tab-productos">
    <div class="card">
      <h3 style="font-size:16px;font-weight:700;margin:0 0 16px;"><i class="fas fa-plus-circle mr-2 text-purple-400"></i>Nuevo producto</h3>
      <div class="grid-2">
        <div class="form-group">
          <label class="label">Categoría</label>
          <select id="prodCategoria" class="select"></select>
        </div>
        <div class="form-group">
          <label class="label">Nombre del producto</label>
          <input id="prodNombre" class="input" placeholder="Ej: Netflix 1 mes">
        </div>
      </div>
      <div class="form-group">
        <label class="label">URL de portada (imagen)</label>
        <input id="prodImagen" class="input" placeholder="https://...">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="label">Precio (Bs)</label>
          <input id="prodPrecio" type="number" step="0.01" min="0" class="input" placeholder="50.00">
        </div>
        <div class="form-group">
          <label class="label">Descripción (opcional)</label>
          <input id="prodDesc" class="input" placeholder="Breve descripción">
        </div>
      </div>
      <div class="form-group">
        <label class="label">Credenciales del producto (lo que verá el comprador)</label>
        <textarea id="prodCreds" class="textarea" placeholder="Usuario: xxxx&#10;Contraseña: yyyy&#10;PIN: 1234"></textarea>
      </div>
      <button class="btn btn-primary" id="addProdBtn"><i class="fas fa-save"></i>Guardar producto</button>
    </div>

    <div class="card">
      <h3 style="font-size:16px;font-weight:700;margin:0 0 16px;"><i class="fas fa-boxes mr-2 text-purple-400"></i>Productos registrados</h3>
      <div class="flex-row" style="margin-bottom:14px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="label">Filtrar por estado</label>
          <select id="filtroEstado" class="select">
            <option value="all">Todos</option>
            <option value="disponible">Disponibles</option>
            <option value="comprado">Comprados</option>
          </select>
        </div>
      </div>
      <div id="prodList" class="grid"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://fmhjuisoibynjgfrqvgj.supabase.co',
  'sb_publishable_M7yramCIWbPyxnH3xwJNEQ_p77ModBz'
);

let cats = [], prods = [];

function toast(msg, type='ok'){
  const t = document.createElement('div');
  t.className = 'toast' + (type==='error'?' error':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
const fmt = (n) => 'Bs ' + parseFloat(n||0).toFixed(2);

// Tabs
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-productos').style.display = t.dataset.tab==='productos'?'':'none';
    document.getElementById('tab-categorias').style.display = t.dataset.tab==='categorias'?'':'none';
  });
});

// Categorías
async function loadCats(){
  const { data, error } = await sb.from('categorias_tarjetas').select('*').order('orden',{ascending:true});
  if (error){ toast('Error cargando categorías','error'); return; }
  cats = data||[];
  renderCats();
  renderCatSelect();
}

function renderCats(){
  const el = document.getElementById('catList');
  if (cats.length===0){ el.innerHTML = '<p style="color:#666;">No hay categorías</p>'; return; }
  el.innerHTML = cats.map(c=>`
    <div class="cat-item">
      <div>
        <div style="font-weight:700;">${c.nombre}</div>
        <div style="font-size:12px;color:#888;">${c.descripcion||'Sin descripción'}</div>
      </div>
      <button class="btn btn-danger" data-del-cat="${c.id}" style="padding:8px 12px;font-size:12px;"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del-cat]').forEach(b=>{
    b.addEventListener('click', ()=>delCat(b.dataset.delCat));
  });
}

function renderCatSelect(){
  const s = document.getElementById('prodCategoria');
  s.innerHTML = '<option value="">Selecciona categoría</option>' + cats.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
}

document.getElementById('addCatBtn').addEventListener('click', async ()=>{
  const nombre = document.getElementById('catNombre').value.trim();
  const descripcion = document.getElementById('catDesc').value.trim();
  if (!nombre){ toast('Escribe un nombre','error'); return; }
  const { error } = await sb.from('categorias_tarjetas').insert([{ nombre, descripcion }]);
  if (error){ toast(error.message,'error'); return; }
  document.getElementById('catNombre').value='';
  document.getElementById('catDesc').value='';
  toast('Categoría creada');
  loadCats();
});

async function delCat(id){
  if (!confirm('¿Eliminar categoría? Los productos también se eliminarán.')) return;
  const { error } = await sb.from('categorias_tarjetas').delete().eq('id', id);
  if (error){ toast(error.message,'error'); return; }
  toast('Categoría eliminada');
  loadCats(); loadProds();
}

// Productos
async function loadProds(){
  const { data, error } = await sb.from('productos_tarjetas').select('*').order('creado_en',{ascending:false});
  if (error){ toast('Error cargando productos','error'); return; }
  prods = data||[];
  renderProds();
}

function renderProds(){
  const filtro = document.getElementById('filtroEstado').value;
  const el = document.getElementById('prodList');
  const list = filtro==='all' ? prods : prods.filter(p=>p.estado===filtro);
  if (list.length===0){
    el.innerHTML = '<p style="color:#666;grid-column:1/-1;">No hay productos</p>';
    return;
  }
  el.innerHTML = list.map(p=>{
    const cat = cats.find(c=>c.id===p.categoria_id);
    return `
      <div class="prod-card">
        <img src="${p.imagen_url}" alt="" onerror="this.src='https://via.placeholder.com/300/1c1c1c/666?text=?'">
        <div class="prod-body">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
            <div class="prod-name">${p.nombre}</div>
            <span class="badge badge-${p.estado}">${p.estado}</span>
          </div>
          <div style="font-size:11px;color:#888;margin-bottom:6px;">${cat?cat.nombre:'Sin categoría'}</div>
          <div class="prod-price">${fmt(p.precio)}</div>
          <div style="font-size:11px;color:#666;margin-bottom:8px;white-space:pre-wrap;max-height:60px;overflow:hidden;">${(p.credenciales||'').substring(0,80)}${(p.credenciales||'').length>80?'...':''}</div>
          <div style="display:flex;gap:6px;">
            ${p.estado==='comprado'?`<button class="btn btn-success" data-reset="${p.id}" style="flex:1;padding:8px;font-size:12px;"><i class="fas fa-undo"></i>Reactivar</button>`:''}
            <button class="btn btn-danger" data-del="${p.id}" style="padding:8px 12px;font-size:12px;"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>delProd(b.dataset.del));
  });
  el.querySelectorAll('[data-reset]').forEach(b=>{
    b.addEventListener('click', ()=>resetProd(b.dataset.reset));
  });
}

document.getElementById('filtroEstado').addEventListener('change', renderProds);

document.getElementById('addProdBtn').addEventListener('click', async ()=>{
  const categoria_id = document.getElementById('prodCategoria').value;
  const nombre = document.getElementById('prodNombre').value.trim();
  const imagen_url = document.getElementById('prodImagen').value.trim();
  const precio = parseFloat(document.getElementById('prodPrecio').value);
  const descripcion = document.getElementById('prodDesc').value.trim();
  const credenciales = document.getElementById('prodCreds').value;
  if (!categoria_id){ toast('Selecciona categoría','error'); return; }
  if (!nombre){ toast('Escribe un nombre','error'); return; }
  if (!imagen_url){ toast('Pega una URL de imagen','error'); return; }
  if (!precio || precio<=0){ toast('Precio inválido','error'); return; }
  if (!credenciales.trim()){ toast('Escribe las credenciales','error'); return; }

  const { error } = await sb.from('productos_tarjetas').insert([{
    categoria_id, nombre, imagen_url, precio, descripcion, credenciales, estado:'disponible'
  }]);
  if (error){ toast(error.message,'error'); return; }
  document.getElementById('prodNombre').value='';
  document.getElementById('prodImagen').value='';
  document.getElementById('prodPrecio').value='';
  document.getElementById('prodDesc').value='';
  document.getElementById('prodCreds').value='';
  toast('Producto agregado');
  loadProds();
});

async function delProd(id){
  if (!confirm('¿Eliminar producto?')) return;
  const { error } = await sb.from('productos_tarjetas').delete().eq('id', id);
  if (error){ toast(error.message,'error'); return; }
  toast('Producto eliminado');
  loadProds();
}

async function resetProd(id){
  if (!confirm('¿Marcar como disponible de nuevo?')) return;
  const { error } = await sb.from('productos_tarjetas').update({
    estado:'disponible', comprado_por:null, comprado_en:null
  }).eq('id', id);
  if (error){ toast(error.message,'error'); return; }
  toast('Producto reactivado');
  loadProds();
}

(async ()=>{
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ window.location.href='index.html'; return; }
  await loadCats();
  await loadProds();
})();
</script>
</body>
</html>
